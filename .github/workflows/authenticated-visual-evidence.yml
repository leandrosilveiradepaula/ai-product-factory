name: Authenticated Console visual evidence

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Exact Console production or Vercel Preview URL to capture
        required: false
        default: https://ai-product-factory-console.vercel.app
        type: string
      target_commit:
        description: Exact repository commit represented by target_url (defaults to workflow SHA)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/authenticated-visual-target.json"
      - ".github/workflows/authenticated-visual-evidence.yml"
      - "scripts/capture_authenticated_console.mjs"

permissions:
  contents: read
  id-token: write

jobs:
  capture:
    runs-on: ubuntu-latest
    environment: openai-api
    timeout-minutes: 12
    env:
      FACTORY_VISUAL_BROKER_URL: "https://fjplmxfcshhbmzgvyqlm.supabase.co/functions/v1/factory-visual-evidence-broker"
      FACTORY_VISUAL_EVIDENCE_DIR: visual-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reject reused GitHub run ID before allocating credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_RUN_ATTEMPT:-0}" != "1" ]; then
            echo "::error::Authenticated visual evidence cannot reuse a GitHub run ID. Use a new workflow_dispatch; re-run would overwrite historical registry identity."
            exit 1
          fi
      - name: Resolve exact visual target
        shell: bash
        env:
          DISPATCH_TARGET_URL: ${{ inputs.target_url || '' }}
          DISPATCH_TARGET_COMMIT: ${{ inputs.target_commit || '' }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require("fs");
          const targetFile=".github/authenticated-visual-target.json";
          let target={};
          if (process.env.GITHUB_EVENT_NAME === "workflow_dispatch" && process.env.DISPATCH_TARGET_URL) {
            target.preview_url=process.env.DISPATCH_TARGET_URL;
            target.candidate_sha=process.env.DISPATCH_TARGET_COMMIT || process.env.GITHUB_SHA;
            target.source="workflow_dispatch";
          } else {
            target=JSON.parse(fs.readFileSync(targetFile,"utf8"));
            target.source="source_control";
          }
          if (typeof target.preview_url !== "string" || !target.preview_url) throw new Error("preview_url missing");
          if (!/^[0-9a-f]{40}$/.test(String(target.candidate_sha||""))) throw new Error("candidate_sha must be exact 40-char SHA");
          const url=new URL(target.preview_url);
          if (url.protocol !== "https:" || !(url.hostname === "ai-product-factory-console.vercel.app" || url.hostname.endsWith(".vercel.app"))) {
            throw new Error("visual target host not allowed");
          }
          if (url.username || url.password || url.search || url.hash) throw new Error("visual target must not contain credentials/query/fragment");
          for (const value of Object.values(target)) {
            if (typeof value === "string" && /(token|secret|password|apikey|authorization)/i.test(value)) throw new Error("secret-like target metadata forbidden");
          }
          fs.appendFileSync(process.env.GITHUB_ENV,
            "FACTORY_CONSOLE_URL="+url.toString().replace(/\/$/,"")+"\n"+
            "FACTORY_VISUAL_TARGET_COMMIT="+target.candidate_sha+"\n");
          console.log("visual_target_source="+target.source);
          console.log("visual_target_host="+url.hostname);
          console.log("visual_target_commit="+target.candidate_sha);
          NODE
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Validate exact visual target
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const target = new URL(process.env.FACTORY_CONSOLE_URL);
            const production = "ai-product-factory-console.vercel.app";
            const allowedHost =
              target.hostname === production ||
              target.hostname.endsWith(".vercel.app");
            if (target.protocol !== "https:" || !allowedHost) {
              core.setFailed("Visual target must be HTTPS on the production host or *.vercel.app");
              return;
            }
            if (target.username || target.password || target.search || target.hash) {
              core.setFailed("Visual target must not contain credentials, query, or fragment");
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(process.env.FACTORY_VISUAL_TARGET_COMMIT)) {
              core.setFailed("target_commit must be an exact 40-character Git SHA");
              return;
            }
            await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.FACTORY_VISUAL_TARGET_COMMIT,
            });
      - name: Install pinned Playwright browser
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Mint short-lived Vercel Trusted Source OIDC token
        id: vercel_oidc
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput("token", token)
      - name: Mint provisioning GitHub OIDC token
        id: oidc_provision
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const token = await core.getIDToken("factory-visual-evidence");
            core.setSecret(token);
            core.setOutput("token", token);
      - name: Provision ephemeral visual operator
        id: provision
        shell: bash
        env:
          FACTORY_GITHUB_OIDC: ${{ steps.oidc_provision.outputs.token }}
        run: |
          set -euo pipefail
          body="$(node -e 'process.stdout.write(JSON.stringify({action:"provision",workflowRunId:Number(process.env.GITHUB_RUN_ID),runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),sourceCommit:process.env.GITHUB_SHA}))')"
          umask 077
          result_file="$(mktemp)"
          trap 'rm -f "$result_file"' EXIT
          http_code="$(curl --silent --show-error --output "$result_file" --write-out '%{http_code}' \
            -H "Authorization: Bearer $FACTORY_GITHUB_OIDC" \
            -H "Content-Type: application/json" \
            --data "$body" \
            "$FACTORY_VISUAL_BROKER_URL")"
          if [ "$http_code" != "200" ]; then
            RESULT_FILE="$result_file" HTTP_CODE="$http_code" node - <<'NODE'
          const fs=require("fs");
          let code="broker_request_failed";
          try {
            const payload=JSON.parse(fs.readFileSync(process.env.RESULT_FILE,"utf8"));
            const allowed=new Set(["github_oidc_invalid","run_identity_mismatch","rerun_requires_new_workflow_run","duplicate_workflow_run","registry_conflict","registry_unavailable","operator_cleanup_failed","admin_operation_failed","broker_operation_failed"]);
            if (allowed.has(payload.error)) code=payload.error;
          } catch {}
          console.error("::error::Visual evidence broker returned HTTP "+process.env.HTTP_CODE+" ("+code+").");
          NODE
            exit 1
          fi
          response="$(cat "$result_file")"
          RESPONSE="$response" node - <<'NODE'
          const data=JSON.parse(process.env.RESPONSE);
          for (const key of ["email","password","userId","encryptionKey","artifactName"]) {
            if (!data[key]) throw new Error("broker response missing "+key);
          }
          for (const value of [data.email,data.password,data.userId,data.encryptionKey]) {
            console.log("::add-mask::"+value);
          }
          const fs=require("fs");
          fs.appendFileSync(process.env.GITHUB_ENV,
            "FACTORY_VISUAL_EMAIL="+data.email+"\n"+
            "FACTORY_VISUAL_PASSWORD="+data.password+"\n"+
            "FACTORY_VISUAL_USER_ID="+data.userId+"\n"+
            "FACTORY_VISUAL_EVIDENCE_KEY="+data.encryptionKey+"\n"+
            "FACTORY_VISUAL_ARTIFACT="+data.artifactName+"\n");
          NODE
      - name: Capture authenticated Console
        id: capture_console
        shell: bash
        env:
          FACTORY_VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.vercel_oidc.outputs.token }}
        run: node scripts/capture_authenticated_console.mjs
      - name: Encrypt visual evidence
        id: encrypt
        shell: bash
        run: |
          set -euo pipefail
          tar -czf visual-evidence.tar.gz visual-evidence
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in visual-evidence.tar.gz \
            -out visual-evidence.tar.gz.enc \
            -pass env:FACTORY_VISUAL_EVIDENCE_KEY
          rm -rf visual-evidence visual-evidence.tar.gz
      - name: Upload encrypted evidence
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ env.FACTORY_VISUAL_ARTIFACT }}
          path: visual-evidence.tar.gz.enc
          retention-days: 1
          if-no-files-found: error
      - name: Mint cleanup GitHub OIDC token
        if: always()
        id: oidc_cleanup
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const token = await core.getIDToken("factory-visual-evidence");
            core.setSecret(token);
            core.setOutput("token", token);
      - name: Finalize registry and remove ephemeral operator
        if: always()
        shell: bash
        env:
          FACTORY_GITHUB_OIDC: ${{ steps.oidc_cleanup.outputs.token }}
          CAPTURE_OUTCOME: ${{ steps.capture_console.outcome }}
          ENCRYPT_OUTCOME: ${{ steps.encrypt.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          if [ -z "${FACTORY_VISUAL_USER_ID:-}" ]; then
            echo "No ephemeral operator was provisioned."
            exit 0
          fi
          if [ "$CAPTURE_OUTCOME" = "success" ] && [ "$ENCRYPT_OUTCOME" = "success" ] && [ "$UPLOAD_OUTCOME" = "success" ]; then
            action="captured"
            body="$(node -e 'process.stdout.write(JSON.stringify({action:"captured",workflowRunId:Number(process.env.GITHUB_RUN_ID),runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT)}))')"
            set +e
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $FACTORY_GITHUB_OIDC" \
              -H "Content-Type: application/json" --data "$body" "$FACTORY_VISUAL_BROKER_URL" >/dev/null
            capture_status=$?
            # Cleanup is mandatory even when writing the 'captured' status fails.
            cleanup="$(node -e 'process.stdout.write(JSON.stringify({action:"cleanup",workflowRunId:Number(process.env.GITHUB_RUN_ID),runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),userId:process.env.FACTORY_VISUAL_USER_ID}))')"
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $FACTORY_GITHUB_OIDC" \
              -H "Content-Type: application/json" --data "$cleanup" "$FACTORY_VISUAL_BROKER_URL" >/dev/null
            cleanup_status=$?
            set -e
            if [ "$capture_status" -ne 0 ] || [ "$cleanup_status" -ne 0 ]; then
              echo "::error::Visual registry finalization or temporary operator deletion failed."
              exit 1
            fi
          else
            body="$(node -e 'process.stdout.write(JSON.stringify({action:"expire",workflowRunId:Number(process.env.GITHUB_RUN_ID),runAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),userId:process.env.FACTORY_VISUAL_USER_ID}))')"
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $FACTORY_GITHUB_OIDC" \
              -H "Content-Type: application/json" --data "$body" "$FACTORY_VISUAL_BROKER_URL" >/dev/null
          fi
