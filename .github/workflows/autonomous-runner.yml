name: Factory autonomous runner

on:
  workflow_dispatch:
    inputs:
      project_key:
        description: Optional project key for backlog dispatch
        required: false
        type: string
      run_direct:
        description: Run at most one Direct implementation task
        required: false
        default: false
        type: boolean
      run_alerts:
        description: Evaluate operational alerts and publish deduplicated GitHub Issues
        required: false
        default: false
        type: boolean
      run_preview:
        description: Run at most one verified Preview deployment
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: factory-autonomous-runner
  cancel-in-progress: false

jobs:
  product-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FACTORY_PRIMARY_MODEL_ENABLED: ${{ vars.FACTORY_PRIMARY_MODEL_ENABLED }}
      FACTORY_MODEL_BUDGET_USD: ${{ vars.FACTORY_MODEL_BUDGET_USD }}
      FACTORY_MODEL_RESERVE_USD: ${{ vars.FACTORY_MODEL_RESERVE_USD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect runtime readiness
        id: readiness
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && { [ -n "$SUPABASE_SECRET_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            echo "control_plane=true" >> "$GITHUB_OUTPUT"
          else
            echo "control_plane=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$FACTORY_PRIMARY_MODEL_ENABLED" = "true" ] && [ -n "$OPENAI_API_KEY" ] && [ -n "$FACTORY_MODEL_BUDGET_USD" ] && [ -n "$FACTORY_MODEL_RESERVE_USD" ]; then
            echo "primary_model=true" >> "$GITHUB_OUTPUT"
          else
            echo "primary_model=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Report blocked dependencies
        if: ${{ steps.readiness.outputs.control_plane != 'true' || steps.readiness.outputs.primary_model != 'true' }}
        shell: bash
        run: |
          echo "Factory runner is healthy but blocked by external configuration."
          echo "control_plane=${{ steps.readiness.outputs.control_plane }}"
          echo "primary_model=${{ steps.readiness.outputs.primary_model }}"
      - name: Report runtime health
        if: ${{ steps.readiness.outputs.control_plane == 'true' }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode health
      - name: Recover expired worker leases
        if: ${{ steps.readiness.outputs.control_plane == 'true' }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode recovery --max-attempts 3
      - name: Process at most one product-stage run
        if: ${{ steps.readiness.outputs.control_plane == 'true' && steps.readiness.outputs.primary_model == 'true' }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode product --worker-id "gha-${{ github.run_id }}"

  ci-followup:
    needs: product-stage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect Control Plane readiness
        id: readiness
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && { [ -n "$SUPABASE_SECRET_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            echo "control_plane=true" >> "$GITHUB_OUTPUT"
          else
            echo "control_plane=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Process at most one pending CI run
        if: ${{ steps.readiness.outputs.control_plane == 'true' }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode ci


  release-followup:
    needs: ci-followup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect Control Plane readiness
        id: readiness
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && { [ -n "$SUPABASE_SECRET_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            echo "control_plane=true" >> "$GITHUB_OUTPUT"
          else
            echo "control_plane=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Observe at most one human release merge
        if: ${{ steps.readiness.outputs.control_plane == 'true' }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode release

  dispatch:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.project_key != '' || inputs.run_direct == true)) }}
    needs: product-stage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dispatch at most one planned task
        shell: bash
        run: |
          if [ -n "${{ inputs.project_key }}" ]; then
            python -m ai_product_factory.runtime_cli --mode dispatch --project-key "${{ inputs.project_key }}"
          else
            python -m ai_product_factory.runtime_cli --mode dispatch
          fi

  direct:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_direct == true) || (github.event_name == 'schedule' && vars.FACTORY_PRIMARY_MODEL_ENABLED == 'true' && vars.FACTORY_MODEL_BUDGET_USD != '' && vars.FACTORY_MODEL_RESERVE_USD != '') }}
    needs: dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: read
    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FACTORY_PRIMARY_MODEL_ENABLED: ${{ vars.FACTORY_PRIMARY_MODEL_ENABLED }}
      FACTORY_MODEL_BUDGET_USD: ${{ vars.FACTORY_MODEL_BUDGET_USD }}
      FACTORY_MODEL_RESERVE_USD: ${{ vars.FACTORY_MODEL_RESERVE_USD }}
      GITHUB_TOKEN: ${{ github.token }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refuse Direct when paid primary model is not explicitly enabled
        if: ${{ env.FACTORY_PRIMARY_MODEL_ENABLED != 'true' }}
        shell: bash
        run: |
          echo "Direct execution is fail-closed: set FACTORY_PRIMARY_MODEL_ENABLED=true only after primary auth/quota readiness is approved."
          exit 1
      - name: Process at most one Direct implementation task
        if: ${{ env.FACTORY_PRIMARY_MODEL_ENABLED == 'true' }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode direct --worker-id "gha-direct-${{ github.run_id }}"


  preview:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_preview == true) }}
    needs: ci-followup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
      FACTORY_VERCEL_PREVIEW_ENABLED: "true"
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      FACTORY_VERCEL_TEAM_ID: ${{ vars.FACTORY_VERCEL_TEAM_ID }}
      FACTORY_VERCEL_PROJECT_NAME: ${{ vars.FACTORY_VERCEL_PROJECT_NAME }}
      FACTORY_BROWSER_EVIDENCE_ENABLED: "true"
      FACTORY_BROWSER_EVIDENCE_COMMAND_JSON: '["node","scripts/verify_preview.mjs"]'
      FACTORY_BROWSER_EVIDENCE_TIMEOUT_SECONDS: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Preview queue without side effects
        id: preview_probe
        shell: bash
        run: |
          python -m ai_product_factory.runtime_cli --mode preview-probe > /tmp/preview-probe.json
          cat /tmp/preview-probe.json
          python - <<'PY'
          import json, os
          data=json.load(open("/tmp/preview-probe.json"))
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"work={'true' if data.get('claimed') else 'false'}\n")
              out.write(f"browser={'true' if data.get('preview_required') else 'false'}\n")
          PY
      - uses: actions/setup-node@v4
        if: ${{ steps.preview_probe.outputs.browser == 'true' }}
        with:
          node-version: "22"
      - name: Install pinned Playwright browser
        if: ${{ steps.preview_probe.outputs.browser == 'true' }}
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Run at most one verified Preview
        if: ${{ steps.preview_probe.outputs.work == 'true' }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode preview

  alerts:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_alerts == true) }}
    needs: release-followup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FACTORY_GITHUB_ALERTS_ENABLED: "true"
      FACTORY_ALERTS_GITHUB_REPOSITORY: ${{ github.repository }}
      FACTORY_MODEL_BUDGET_USD: ${{ vars.FACTORY_MODEL_BUDGET_USD }}
      GITHUB_TOKEN: ${{ github.token }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate and publish operational alerts
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode alerts
