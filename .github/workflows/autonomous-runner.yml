name: Factory autonomous runner

on:
  workflow_dispatch:
    inputs:
      project_key:
        description: Optional project key for backlog dispatch
        required: false
        type: string
      run_direct:
        description: Run at most one Direct implementation task
        required: false
        default: false
        type: boolean
      run_alerts:
        description: Evaluate operational alerts and publish deduplicated GitHub Issues
        required: false
        default: false
        type: boolean
      run_preview:
        description: Run at most one verified Preview deployment
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: factory-autonomous-runner
  cancel-in-progress: false

jobs:
  product-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FACTORY_PRIMARY_MODEL_ENABLED: ${{ vars.FACTORY_PRIMARY_MODEL_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect runtime readiness
        id: readiness
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && { [ -n "$SUPABASE_SECRET_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            echo "control_plane=true" >> "$GITHUB_OUTPUT"
          else
            echo "control_plane=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$FACTORY_PRIMARY_MODEL_ENABLED" = "true" ] && [ -n "$OPENAI_API_KEY" ]; then
            echo "primary_model=true" >> "$GITHUB_OUTPUT"
          else
            echo "primary_model=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Report blocked dependencies
        if: ${{ steps.readiness.outputs.control_plane != 'true' || steps.readiness.outputs.primary_model != 'true' }}
        shell: bash
        run: |
          echo "Factory runner is healthy but blocked by external configuration."
          echo "control_plane=${{ steps.readiness.outputs.control_plane }}"
          echo "primary_model=${{ steps.readiness.outputs.primary_model }}"
      - name: Report runtime health
        if: ${{ steps.readiness.outputs.control_plane == 'true' }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode health
      - name: Recover expired worker leases
        if: ${{ steps.readiness.outputs.control_plane == 'true' }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode recovery --max-attempts 3
      - name: Process at most one product-stage run
        if: ${{ steps.readiness.outputs.control_plane == 'true' && steps.readiness.outputs.primary_model == 'true' }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode product --worker-id "gha-${{ github.run_id }}"

  ci-followup:
    needs: product-stage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect Control Plane readiness
        id: readiness
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && { [ -n "$SUPABASE_SECRET_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            echo "control_plane=true" >> "$GITHUB_OUTPUT"
          else
            echo "control_plane=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Process at most one pending CI run
        if: ${{ steps.readiness.outputs.control_plane == 'true' }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode ci


  release-followup:
    needs: ci-followup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect Control Plane readiness
        id: readiness
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && { [ -n "$SUPABASE_SECRET_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            echo "control_plane=true" >> "$GITHUB_OUTPUT"
          else
            echo "control_plane=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Observe at most one human release merge
        if: ${{ steps.readiness.outputs.control_plane == 'true' }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode release

  dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.project_key != '' }}
    needs: product-stage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dispatch at most one planned task
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode dispatch --project-key "${{ inputs.project_key }}"

  direct:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_direct == true }}
    needs: product-stage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: read
    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FACTORY_PRIMARY_MODEL_ENABLED: ${{ vars.FACTORY_PRIMARY_MODEL_ENABLED }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refuse Direct when paid primary model is not explicitly enabled
        if: ${{ env.FACTORY_PRIMARY_MODEL_ENABLED != 'true' }}
        shell: bash
        run: |
          echo "Direct execution is fail-closed: set FACTORY_PRIMARY_MODEL_ENABLED=true only after primary auth/quota readiness is approved."
          exit 1
      - name: Process at most one Direct implementation task
        if: ${{ env.FACTORY_PRIMARY_MODEL_ENABLED == 'true' }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode direct --worker-id "gha-direct-${{ github.run_id }}"


  preview:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_preview == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      FACTORY_VERCEL_PREVIEW_ENABLED: ${{ vars.FACTORY_VERCEL_PREVIEW_ENABLED }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      FACTORY_VERCEL_TEAM_ID: ${{ vars.FACTORY_VERCEL_TEAM_ID }}
      FACTORY_VERCEL_PROJECT_NAME: ${{ vars.FACTORY_VERCEL_PROJECT_NAME }}
      FACTORY_BROWSER_EVIDENCE_ENABLED: ${{ vars.FACTORY_BROWSER_EVIDENCE_ENABLED }}
      FACTORY_BROWSER_EVIDENCE_COMMAND_JSON: ${{ vars.FACTORY_BROWSER_EVIDENCE_COMMAND_JSON }}
      FACTORY_BROWSER_EVIDENCE_TIMEOUT_SECONDS: ${{ vars.FACTORY_BROWSER_EVIDENCE_TIMEOUT_SECONDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run at most one verified Preview
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode preview

  alerts:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_alerts == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      PYTHONPATH: src
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FACTORY_GITHUB_ALERTS_ENABLED: ${{ vars.FACTORY_GITHUB_ALERTS_ENABLED }}
      FACTORY_ALERTS_GITHUB_REPOSITORY: ${{ github.repository }}
      FACTORY_MODEL_BUDGET_USD: ${{ vars.FACTORY_MODEL_BUDGET_USD }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate and publish operational alerts
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode alerts
