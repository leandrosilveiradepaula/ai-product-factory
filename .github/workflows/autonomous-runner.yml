          python - <<'PY'
          import json, os, re, uuid
          data=json.load(open("/tmp/preview-probe.json"))
          claimed=data.get("claimed") is True
          run_id=data.get("run_id")
          sha=data.get("candidate_commit")
          if claimed:
              if (not isinstance(run_id,str) or not isinstance(sha,str)
                  or not re.fullmatch(r"[0-9a-f]{40}",sha)):
                  raise RuntimeError("Preview probe has no valid run/SHA receipt")
