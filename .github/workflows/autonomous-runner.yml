name: Factory autonomous runner

on:
  repository_dispatch:
    types: [factory-intake-wake]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      project_key:
        description: Optional project key for backlog dispatch
        required: false
        type: string
      run_direct:
        description: Run at most one Direct implementation task
        required: false
        default: false
        type: boolean
      run_codex:
        description: Run at most one Codex implementation task
        required: false
        default: false
        type: boolean
      run_alerts:
        description: Evaluate operational alerts and publish deduplicated GitHub Issues
        required: false
        default: false
        type: boolean
      run_preview:
        description: Run at most one verified Preview deployment
        required: false
        default: false
        type: boolean
  workflow_run:
    # Reuses existing trusted six-hour OIDC preflight cron, no new timer.
    workflows: ["Control Plane OIDC preflight"]
    types: [completed]
    branches: [main]
  schedule:
    # Independent staggered wake opportunities: GitHub may delay or drop scheduled events.
    # This is best-effort redundancy, not a guaranteed 30-minute SLA.
    - cron: "17 * * * *"
    - cron: "47 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: factory-autonomous-runner
  cancel-in-progress: false

jobs:
  schedule-probe:
    if: ${{ (github.event_name != 'issue_comment' || (github.event.comment.body == '/factory-wake' && github.event.comment.author_association == 'OWNER')) && (github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository)) && (github.event_name != 'repository_dispatch' || (github.actor == 'infodive-ai-product-factory[bot]' && github.event.action == 'factory-intake-wake' && github.event.client_payload.source == 'console-intake')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      github_access_work: ${{ steps.probe.outputs.github_access_work }}
      product_work: ${{ steps.probe.outputs.product_work }}
      dispatch_work: ${{ steps.probe.outputs.dispatch_work }}
      integration_work: ${{ steps.probe.outputs.integration_work }}
      ci_work: ${{ steps.probe.outputs.ci_work }}
      specialist_work: ${{ steps.probe.outputs.specialist_work }}
      specialist_security_work: ${{ steps.probe.outputs.specialist_security_work }}
      specialist_qa_work: ${{ steps.probe.outputs.specialist_qa_work }}
      specialist_operations_work: ${{ steps.probe.outputs.specialist_operations_work }}
      preview_work: ${{ steps.probe.outputs.preview_work }}
      release_work: ${{ steps.probe.outputs.release_work }}
      codex_manual_work: ${{ steps.probe.outputs.codex_manual_work }}
      work_detected: ${{ steps.probe.outputs.work_detected }}
    env:
      PYTHONPATH: src
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      FACTORY_GITHUB_ALERTS_ENABLED: "true"
      FACTORY_ALERTS_GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify backup scheduler wake is necessary
        if: ${{ github.event_name == 'workflow_run' }}
        id: backup_wake
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from ai_product_factory.supabase_scheduler_liveness import (
              SupabaseSchedulerLivenessReader, evaluate_scheduler_liveness
          )
          liveness = SupabaseSchedulerLivenessReader().read()
          needed = any(a.code == "scheduler_gap"
                       for a in evaluate_scheduler_liveness(liveness))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("wake=" + ("true" if needed else "false") + "\n")
          print("backup_wake_needed=" + ("true" if needed else "false"))
          PY
      - name: Recover expired leases in the shared scheduler runner
        if: ${{ github.event_name == 'schedule' || github.event_name == 'issue_comment' || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.run_alerts != true) || (github.event_name == 'workflow_run' && steps.backup_wake.outputs.wake == 'true') }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode recovery --max-attempts 3
      - name: Settle quiescent manual project controls
        if: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && steps.backup_wake.outputs.wake == 'true') }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode project-control-settle
      - name: Probe durable work queues without side effects
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run_alerts != true) && (github.event_name != 'workflow_run' || steps.backup_wake.outputs.wake == 'true') }}
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          python -m ai_product_factory.runtime_cli --mode schedule-probe > /tmp/factory-schedule-probe.json
          cat /tmp/factory-schedule-probe.json
          python - <<'PY'
          import json, os
          data=json.load(open("/tmp/factory-schedule-probe.json"))
          keys=(
              "github_access_work","product_work","dispatch_work","integration_work","ci_work",
              "specialist_work","specialist_security_work","specialist_qa_work",
              "specialist_operations_work","preview_work","release_work",
              "codex_manual_work","work_detected",
          )
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              for key in keys:
                  out.write(f"{key}={'true' if data.get(key) else 'false'}\n")
          PY
      - name: Diagnose historical queued backlog without dispatch
        if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_run' && steps.backup_wake.outputs.wake == 'true')) && steps.probe.outputs.work_detected == 'false' }}
        continue-on-error: true
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode backlog-audit
  github-access-preflight:
    environment: openai-api
    needs: schedule-probe
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run_alerts != true) && always() && needs.schedule-probe.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.schedule-probe.outputs.github_access_work == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      issues: read
      pull-requests: read
      actions: read
      statuses: read
      checks: read
    env:
      PYTHONPATH: src
      GITHUB_TOKEN: ${{ github.token }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify one project GitHub capability contract
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && { [ -n "$SUPABASE_SECRET_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            if [ -n "${{ inputs.project_key }}" ]; then
              python -m ai_product_factory.runtime_cli --mode github-preflight --project-key "${{ inputs.project_key }}"
            else
              python -m ai_product_factory.runtime_cli --mode github-preflight
            fi
          else
            echo "GitHub capability preflight is inert: Control Plane credentials are not configured."
          fi

  product-stage:
    needs: schedule-probe
    outputs:
      primary_ready: ${{ steps.readiness.outputs.primary_model }}
      dispatch_work: ${{ steps.post_product_probe.outputs.dispatch_work }}
    # Auth preflight is also needed when the only work is already planned.
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run_alerts != true) && always() && needs.schedule-probe.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.schedule-probe.outputs.product_work == 'true' || needs.schedule-probe.outputs.dispatch_work == 'true') }}
    runs-on: ubuntu-latest
    environment: openai-api
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 8
    env:
      PYTHONPATH: src
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
      OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
      OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
      FACTORY_PRIMARY_AUTH_MODE: api_key
      # Never imply paid authorization from a secret alone; unset GitHub variable stays off.
      FACTORY_PRIMARY_MODEL_ENABLED: ${{ vars.FACTORY_PRIMARY_MODEL_ENABLED == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Detect runtime readiness
        id: readiness
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && { [ -n "$SUPABASE_SECRET_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            echo "control_plane=true" >> "$GITHUB_OUTPUT"
          else
            echo "control_plane=false" >> "$GITHUB_OUTPUT"
          fi
          primary_auth=false
          case "$FACTORY_PRIMARY_AUTH_MODE" in
            api_key)
              [ -n "$OPENAI_API_KEY" ] && primary_auth=true
              ;;
            wif)
              if [ -n "$OPENAI_IDENTITY_PROVIDER_ID" ] && [ -n "$OPENAI_SERVICE_ACCOUNT_ID" ] && [ -n "$OPENAI_WIF_AUDIENCE" ]; then
                primary_auth=true
              fi
              ;;
            auto|"")
              if [ -n "$OPENAI_IDENTITY_PROVIDER_ID$OPENAI_SERVICE_ACCOUNT_ID$OPENAI_WIF_AUDIENCE" ]; then
                if [ -n "$OPENAI_IDENTITY_PROVIDER_ID" ] && [ -n "$OPENAI_SERVICE_ACCOUNT_ID" ] && [ -n "$OPENAI_WIF_AUDIENCE" ]; then
                  primary_auth=true
                fi
              elif [ -n "$OPENAI_API_KEY" ]; then
                primary_auth=true
              fi
              ;;
            *) primary_auth=false ;;
          esac
          # The independent Product Stage preflight fetches the currently
          # approved primary budget from the Control Plane and rejects a
          # missing/stale policy before any paid claim.
          if [ "$FACTORY_PRIMARY_MODEL_ENABLED" = "true" ] \
             && [ "$primary_auth" = "true" ]; then
            echo "primary_model=true" >> "$GITHUB_OUTPUT"
          else
            echo "primary_model=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Report blocked dependencies
        if: ${{ steps.readiness.outputs.control_plane != 'true' || steps.readiness.outputs.primary_model != 'true' }}
        shell: bash
        run: |
          echo "Factory runner is healthy but blocked by external configuration."
          echo "control_plane=${{ steps.readiness.outputs.control_plane }}"
          echo "primary_model=${{ steps.readiness.outputs.primary_model }}"
      - name: Report runtime health
        if: ${{ steps.readiness.outputs.control_plane == 'true' }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode health
      - name: Recover expired worker leases
        if: ${{ steps.readiness.outputs.control_plane == 'true' }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode recovery --max-attempts 3
      - name: Record run-linked Product Stage readiness without paid model calls
        id: product_readiness_evidence
        if: ${{ steps.readiness.outputs.control_plane == 'true' && (needs.schedule-probe.outputs.product_work == 'true' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        run: |
          set -euo pipefail
          python -m ai_product_factory.runtime_cli --mode product-readiness-evidence > /tmp/factory-product-readiness-evidence.json
          cat /tmp/factory-product-readiness-evidence.json
          python - <<'PY'
          import json, os
          data=json.load(open('/tmp/factory-product-readiness-evidence.json'))
          ready=data.get('ready') is True
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('ready=' + ('true' if ready else 'false') + '\n')
          if not ready:
              reason=str(data.get('reason_code') or 'readiness_unknown')
              print('::warning title=Product Stage blocked::' + reason)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
                  out.write('### Product Stage: blocked, not executed\n')
                  out.write('Reason: ' + reason + '; run audits: ' + str(data.get('recorded', 0)) + '. No paid model call.\n')
          PY
      - name: Process at most one product-stage run
        id: product_run
        # Do not call the model merely to check dispatch-only readiness.
        if: ${{ steps.readiness.outputs.control_plane == 'true' && steps.readiness.outputs.primary_model == 'true' && steps.product_readiness_evidence.outputs.ready == 'true' && (needs.schedule-probe.outputs.product_work == 'true' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        run: |
          set -euo pipefail
          python -m ai_product_factory.runtime_cli --mode product --worker-id "gha-${{ github.run_id }}" > /tmp/factory-product-run.json
          cat /tmp/factory-product-run.json
          python - <<'PY'
          import json,os
          from ai_product_factory.runner_signals import product_run_completed
          with open("/tmp/factory-product-run.json") as raw:
              result=json.load(raw)
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("completed="+("true" if product_run_completed(result) else "false")+"\n")
          PY
      - name: Probe freshly materialized dispatch work after product completion
        id: post_product_probe
        if: ${{ steps.product_run.outputs.completed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m ai_product_factory.runtime_cli --mode schedule-probe > /tmp/factory-post-product-probe.json
          cat /tmp/factory-post-product-probe.json
          python - <<'PY'
          import json,os
          from ai_product_factory.runner_signals import dispatch_queue_ready
          with open("/tmp/factory-post-product-probe.json") as raw:
              result=json.load(raw)
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("dispatch_work="+("true" if dispatch_queue_ready(result) else "false")+"\n")
          PY


  change-set-integration:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run_alerts != true) && always() && needs.schedule-probe.result == 'success' && needs.direct.result != 'failure' && needs.codex.result != 'failure' && (github.event_name == 'workflow_dispatch' || needs.schedule-probe.outputs.integration_work == 'true' || needs.direct.result == 'success' || needs.codex.result == 'success') }}
    needs: [schedule-probe, direct, codex]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: write
      contents: write
      id-token: write
      issues: write
      pull-requests: write
      checks: read
    env:
      PYTHONPATH: src
      GITHUB_TOKEN: ${{ github.token }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Integrate up to three eligible Change Set waves
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && { [ -n "$SUPABASE_SECRET_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            python -m ai_product_factory.runtime_cli --mode change-set-integration --batch-items 3 --worker-id "integrator-${{ github.run_id }}"
          else
            echo "Change Set integration is inert: Control Plane credentials are not configured."
          fi

  ci-followup:
    environment: openai-api
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run_alerts != true) && always() && needs.schedule-probe.result == 'success' && needs.change-set-integration.result != 'failure' && (github.event_name == 'workflow_dispatch' || needs.schedule-probe.outputs.ci_work == 'true' || needs.change-set-integration.result == 'success') }}
    needs: [schedule-probe, product-stage, change-set-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      issues: read
      pull-requests: read
      checks: read
    env:
      PYTHONPATH: src
      GITHUB_TOKEN: ${{ github.token }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Detect Control Plane readiness
        id: readiness
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && { [ -n "$SUPABASE_SECRET_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            echo "control_plane=true" >> "$GITHUB_OUTPUT"
          else
            echo "control_plane=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Process up to three distinct pending CI candidates
        if: ${{ steps.readiness.outputs.control_plane == 'true' }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode ci --batch-items 3


  specialist-security:
    environment: openai-api
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run_alerts != true) && always() && needs.schedule-probe.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.schedule-probe.outputs.specialist_security_work == 'true' || needs.ci-followup.result == 'success') }}
    needs: [schedule-probe, ci-followup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      checks: read
    env:
      PYTHONPATH: src
      GITHUB_TOKEN: ${{ github.token }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Run up to three Security specialist reviews
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && { [ -n "$SUPABASE_SECRET_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            python -m ai_product_factory.runtime_cli --mode specialist --specialist-role security --batch-items 3 --worker-id "security-${{ github.run_id }}"
          else
            echo "Security specialist lane is inert: Control Plane credentials are not configured."
          fi

  specialist-qa:
    environment: openai-api
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run_alerts != true) && always() && needs.schedule-probe.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.schedule-probe.outputs.specialist_qa_work == 'true' || needs.ci-followup.result == 'success') }}
    needs: [schedule-probe, ci-followup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      checks: read
    env:
      PYTHONPATH: src
      GITHUB_TOKEN: ${{ github.token }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Run up to three QA specialist reviews
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && { [ -n "$SUPABASE_SECRET_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            python -m ai_product_factory.runtime_cli --mode specialist --specialist-role qa --batch-items 3 --worker-id "qa-${{ github.run_id }}"
          else
            echo "QA specialist lane is inert: Control Plane credentials are not configured."
          fi

  specialist-operations:
    environment: openai-api
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run_alerts != true) && always() && needs.schedule-probe.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.schedule-probe.outputs.specialist_operations_work == 'true' || needs.ci-followup.result == 'success') }}
    needs: [schedule-probe, ci-followup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      checks: read
    env:
      PYTHONPATH: src
      GITHUB_TOKEN: ${{ github.token }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Run up to three Operations specialist reviews
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && { [ -n "$SUPABASE_SECRET_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            python -m ai_product_factory.runtime_cli --mode specialist --specialist-role operations --batch-items 3 --worker-id "operations-${{ github.run_id }}"
          else
            echo "Operations specialist lane is inert: Control Plane credentials are not configured."
          fi


  release-followup:
    environment: openai-api
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run_alerts != true) && always() && needs.schedule-probe.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.schedule-probe.outputs.release_work == 'true') }}
    needs: [schedule-probe, ci-followup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: read
    env:
      PYTHONPATH: src
      GITHUB_TOKEN: ${{ github.token }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Detect Control Plane readiness
        id: readiness
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && { [ -n "$SUPABASE_SECRET_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            echo "control_plane=true" >> "$GITHUB_OUTPUT"
          else
            echo "control_plane=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Observe up to three already-human-merged releases
        if: ${{ steps.readiness.outputs.control_plane == 'true' }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode release --batch-items 3

  dispatch:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run_alerts != true) && always() && needs.schedule-probe.result == 'success' && needs.github-access-preflight.result != 'failure' && needs.product-stage.result != 'failure' && needs.codex-route-preflight.result != 'failure' && (((github.event_name == 'schedule' || github.event_name == 'issue_comment') && (needs.schedule-probe.outputs.dispatch_work == 'true' || needs.product-stage.outputs.dispatch_work == 'true')) || (github.event_name == 'workflow_dispatch' && (inputs.project_key != '' || inputs.run_direct == true || inputs.run_codex == true))) }}
    needs: [schedule-probe, github-access-preflight, product-stage, codex-route-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      direct_count: ${{ steps.dispatch.outputs.direct_count }}
      codex_count: ${{ steps.dispatch.outputs.codex_count }}
      direct_matrix: ${{ steps.dispatch.outputs.direct_matrix }}
      codex_matrix: ${{ steps.dispatch.outputs.codex_matrix }}
    env:
      PYTHONPATH: src
      # Never pass the OpenAI key to dispatcher. Only the prior auth signal.
      # Trust the protected Product Stage readiness, not a repository-scope variable.
      # A missing/stale output fails closed; the paid ledger gate remains mandatory.
      FACTORY_PRIMARY_MODEL_ENABLED: ${{ needs.product-stage.outputs.primary_ready == 'true' && 'true' || 'false' }}
      FACTORY_DISPATCH_PRIMARY_READY: ${{ needs.product-stage.outputs.primary_ready == 'true' && 'true' || 'false' }}
      FACTORY_CODEX_ENABLED: ${{ vars.FACTORY_CODEX_ENABLED == 'true' && 'true' || 'false' }}
      # No Codex token/WIF claims ever cross into dispatcher.
      FACTORY_DISPATCH_CODEX_READY: ${{ needs.codex-route-preflight.outputs.ready == 'true' && 'true' || 'false' }}
      FACTORY_CODEX_COST_APPROVED: ${{ vars.FACTORY_CODEX_COST_APPROVED == 'true' && 'true' || 'false' }}
      FACTORY_CODEX_MANUAL_FALLBACK_ENABLED: ${{ vars.FACTORY_CODEX_MANUAL_FALLBACK_ENABLED == 'true' && 'true' || 'false' }}
      # Only the explicitly opted-in manual handoff may be routed without Primary.
      FACTORY_DISPATCH_MANUAL_CODEX_READY: ${{ vars.FACTORY_CODEX_ENABLED != 'true' && vars.FACTORY_CODEX_MANUAL_FALLBACK_ENABLED == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Detect Control Plane readiness
        id: readiness
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && { [ -n "$SUPABASE_SECRET_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            echo "control_plane=true" >> "$GITHUB_OUTPUT"
          else
            echo "control_plane=false" >> "$GITHUB_OUTPUT"
            echo "Dispatch is inert: Control Plane credentials are not configured."
          fi
      - name: Dispatch and build specialist matrix
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.readiness.outputs.control_plane }}" != "true" ]; then
            printf '%s\n' '{"claimed":false,"status":"blocked","matrix":{"direct":[],"codex":[]}}' > /tmp/factory-dispatch.json
          elif [ -n "${{ inputs.project_key }}" ]; then
            python -m ai_product_factory.runtime_cli --mode dispatch --max-items 6 --project-key "${{ inputs.project_key }}" > /tmp/factory-dispatch.json
          else
            python -m ai_product_factory.runtime_cli --mode dispatch --max-items 6 > /tmp/factory-dispatch.json
          fi
          cat /tmp/factory-dispatch.json
          python - <<'PY'
          import json,os
          data=json.load(open("/tmp/factory-dispatch.json"))
          matrix=data.get("matrix") or {}
          direct=list(matrix.get("direct") or [])
          codex=list(matrix.get("codex") or [])
          # Manual Codex requires no agent reservation; wake its handoff
          # from the durable routes just claimed, not from assigned matrix.
          handoffs=sum(
              route.get("route")=="codex" and route.get("human_gate_required") is False
              for route in (data.get("routed") or [])
          ) if os.environ.get("FACTORY_CODEX_ENABLED") != "true" else 0
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("direct_count="+str(len(direct))+"\n")
              out.write("codex_count="+str(len(codex)+handoffs)+"\n")
              out.write("direct_matrix="+json.dumps({"include":direct},separators=(",",":"))+"\n")
              out.write("codex_matrix="+json.dumps({"include":codex},separators=(",",":"))+"\n")
          PY

  direct:
    environment: openai-api
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run_alerts != true) && always() && needs.dispatch.result == 'success' && needs.dispatch.outputs.direct_count != '' && needs.dispatch.outputs.direct_count != '0' && ((github.event_name == 'workflow_dispatch' && inputs.run_direct == true) || github.event_name == 'schedule' || github.event_name == 'issue_comment') }}
    needs: dispatch
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.dispatch.outputs.direct_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
      checks: read
    env:
      PYTHONPATH: src
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
      OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
      OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
      FACTORY_PRIMARY_AUTH_MODE: api_key
      # Never imply paid authorization from a secret alone; unset GitHub variable stays off.
      FACTORY_PRIMARY_MODEL_ENABLED: ${{ vars.FACTORY_PRIMARY_MODEL_ENABLED == 'true' && 'true' || 'false' }}
      GITHUB_TOKEN: ${{ github.token }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Detect Direct Control Plane readiness
        id: readiness
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && { [ -n "$SUPABASE_SECRET_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            echo "control_plane=true" >> "$GITHUB_OUTPUT"
          else
            echo "control_plane=false" >> "$GITHUB_OUTPUT"
            echo "Direct execution is inert: Control Plane credentials are not configured."
          fi
      - name: Refuse Direct when paid primary model is not explicitly enabled
        if: ${{ steps.readiness.outputs.control_plane == 'true' && env.FACTORY_PRIMARY_MODEL_ENABLED != 'true' }}
        shell: bash
        run: |
          echo "Direct execution is fail-closed: set FACTORY_PRIMARY_MODEL_ENABLED=true only after primary auth/quota readiness is approved."
          exit 1
      - name: Validate Direct primary authentication
        if: ${{ steps.readiness.outputs.control_plane == 'true' && env.FACTORY_PRIMARY_MODEL_ENABLED == 'true' }}
        shell: bash
        run: |
          case "$FACTORY_PRIMARY_AUTH_MODE" in
            api_key)
              if [ -z "$OPENAI_API_KEY" ]; then
                echo "Direct execution requires OPENAI_API_KEY in api_key mode."
                exit 2
              fi
              ;;
            wif)
              if [ -z "$OPENAI_IDENTITY_PROVIDER_ID" ] || [ -z "$OPENAI_SERVICE_ACCOUNT_ID" ] || [ -z "$OPENAI_WIF_AUDIENCE" ]; then
                echo "Direct execution requires complete OpenAI API WIF in wif mode."
                exit 2
              fi
              ;;
            *)
              echo "Unsupported FACTORY_PRIMARY_AUTH_MODE=$FACTORY_PRIMARY_AUTH_MODE"
              exit 2
              ;;
          esac
      - name: Process assigned Direct specialist task
        if: ${{ steps.readiness.outputs.control_plane == 'true' && env.FACTORY_PRIMARY_MODEL_ENABLED == 'true' }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode direct --worker-id "gha-direct-${{ github.run_id }}-${{ strategy.job-index }}" --agent-key "${{ matrix.agent_key }}" --run-id "${{ matrix.run_id }}"


  codex:
    environment: openai-codex
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run_alerts != true) && always() && needs.dispatch.result == 'success' && needs.dispatch.outputs.codex_count != '' && needs.dispatch.outputs.codex_count != '0' && vars.FACTORY_CODEX_ENABLED == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_codex == true)) }}
    needs: dispatch
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.dispatch.outputs.codex_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONPATH: src
      FACTORY_CODEX_ENABLED: ${{ vars.FACTORY_CODEX_ENABLED }}
      OPENAI_FEDERATION_RULE_ID: ${{ vars.OPENAI_FEDERATION_RULE_ID }}
      OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
      OPENAI_WORKLOAD_IDENTITY_CONTEXT: '{"instance_id":"github-actions-codex-worker","display_name":"ai-product-factory","labels":{"repository":"ai-product-factory","environment":"openai-codex"}}'
      FACTORY_CODEX_GITHUB_ENVIRONMENT: openai-codex
      GITHUB_TOKEN: ${{ github.token }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
      FACTORY_CODEX_TIMEOUT_SECONDS: "900"
      FACTORY_CODEX_MAX_FILES: "20"
      FACTORY_CODEX_MAX_BYTES: "250000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - name: Detect Codex runtime readiness
        id: readiness
        env:
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
        shell: bash
        run: |
          auth_mode=none
          if [ -n "$OPENAI_FEDERATION_RULE_ID$OPENAI_WIF_AUDIENCE" ]; then
            if [ -n "$OPENAI_FEDERATION_RULE_ID" ] && [ -n "$OPENAI_WIF_AUDIENCE" ]; then
              auth_mode=wif
              echo "OPENAI_IDENTITY_TOKEN_FILE=/home/runner/work/_temp/openai-wif/identity-token" >> "$GITHUB_ENV"
            else
              echo "Codex WIF is partially configured; refusing access-token fallback."
            fi
          elif [ -n "$CODEX_ACCESS_TOKEN" ]; then
            auth_mode=access_token
          fi
          echo "auth_mode=$auth_mode" >> "$GITHUB_OUTPUT"

          if [ "$FACTORY_CODEX_ENABLED" = "true" ] \
             && [ "$auth_mode" != "none" ] \
             && [ -n "$GITHUB_TOKEN" ] \
             && [ -n "$SUPABASE_URL" ] \
             && { [ -n "$SUPABASE_SECRET_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Codex worker is inert: enable flag, complete official Codex auth, native repository credential, and Control Plane credentials are required. Cross-repository work still requires FACTORY_GITHUB_TOKEN at execution time."
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: ${{ steps.readiness.outputs.ready == 'true' }}
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: ${{ steps.readiness.outputs.ready == 'true' }}
        with:
          node-version: "22"
      - name: Install pinned Codex CLI
        if: ${{ steps.readiness.outputs.ready == 'true' }}
        shell: bash
        run: |
          npm install -g @openai/codex@0.157.0
          codex --version
      - name: Process at most one Codex implementation task
        if: ${{ steps.readiness.outputs.ready == 'true' }}
        env:
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.readiness.outputs.auth_mode }}" = "wif" ]; then
            python -m ai_product_factory.codex_oidc --refresh-seconds 240 &
            OIDC_PID=$!
            cleanup() {
              kill "$OIDC_PID" 2>/dev/null || true
              wait "$OIDC_PID" 2>/dev/null || true
            }
            trap cleanup EXIT
            for _ in $(seq 1 40); do
              if [ -s "$OPENAI_IDENTITY_TOKEN_FILE" ]; then
                break
              fi
              if ! kill -0 "$OIDC_PID" 2>/dev/null; then
                echo "OIDC refresher exited before producing a token."
                exit 2
              fi
              sleep 0.25
            done
            test -s "$OPENAI_IDENTITY_TOKEN_FILE"
          fi
          python -m ai_product_factory.runtime_cli --mode codex --worker-id "gha-codex-${{ github.run_id }}-${{ strategy.job-index }}" --agent-key "${{ matrix.agent_key }}" --run-id "${{ matrix.run_id }}"



  codex-manual:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run_alerts != true) && always() && needs.schedule-probe.result == 'success' && (needs.dispatch.result == 'success' || needs.dispatch.result == 'skipped') && ((github.event_name == 'schedule' && (needs.schedule-probe.outputs.codex_manual_work == 'true' || (needs.dispatch.outputs.codex_count != '' && needs.dispatch.outputs.codex_count != '0'))) || (github.event_name == 'workflow_dispatch' && inputs.run_codex == true)) }}
    needs: [schedule-probe, dispatch]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: read
    env:
      PYTHONPATH: src
      GITHUB_TOKEN: ${{ github.token }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
      FACTORY_CODEX_ENABLED: ${{ vars.FACTORY_CODEX_ENABLED }}
      FACTORY_CODEX_MANUAL_FALLBACK_ENABLED: ${{ vars.FACTORY_CODEX_MANUAL_FALLBACK_ENABLED == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Detect Control Plane readiness
        id: readiness
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && { [ -n "$SUPABASE_SECRET_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            echo "control_plane=true" >> "$GITHUB_OUTPUT"
          else
            echo "control_plane=false" >> "$GITHUB_OUTPUT"
            echo "Manual Codex handoff is inert: Control Plane credentials are not configured."
          fi
      - name: Prepare at most one manual Codex handoff
        if: ${{ steps.readiness.outputs.control_plane == 'true' && env.FACTORY_CODEX_ENABLED != 'true' && env.FACTORY_CODEX_MANUAL_FALLBACK_ENABLED == 'true' }}
        shell: bash
        run: python -m ai_product_factory.manual_codex_handoff --mode prepare --worker-id "gha-codex-manual-${{ github.run_id }}"
      - name: Resume at most one completed manual Codex handoff
        if: ${{ steps.readiness.outputs.control_plane == 'true' }}
        shell: bash
        run: python -m ai_product_factory.manual_codex_handoff --mode followup

  preview:
    environment: openai-api
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run_alerts != true) && always() && needs.schedule-probe.result == 'success' && (((github.event_name == 'schedule' || github.event_name == 'issue_comment') && (needs.schedule-probe.outputs.preview_work == 'true' || needs.specialist-security.result == 'success' || needs.specialist-qa.result == 'success' || needs.specialist-operations.result == 'success')) || (github.event_name == 'workflow_dispatch' && inputs.run_preview == true)) }}
    needs: [schedule-probe, specialist-security, specialist-qa, specialist-operations]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      issues: read
      pull-requests: read
      checks: read
    env:
      PYTHONPATH: src
      GITHUB_TOKEN: ${{ github.token }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
      FACTORY_VERCEL_PREVIEW_ENABLED: "true"
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      FACTORY_VERCEL_TEAM_ID: ${{ vars.FACTORY_VERCEL_TEAM_ID }}
      FACTORY_VERCEL_PROJECT_NAME: ${{ vars.FACTORY_VERCEL_PROJECT_NAME }}
      FACTORY_BROWSER_EVIDENCE_ENABLED: "true"
      FACTORY_BROWSER_EVIDENCE_COMMAND_JSON: '["node","scripts/verify_preview.mjs"]'
      FACTORY_BROWSER_EVIDENCE_TIMEOUT_SECONDS: "120"
      FACTORY_BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Detect Control Plane readiness
        id: readiness
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && { [ -n "$SUPABASE_SECRET_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            echo "control_plane=true" >> "$GITHUB_OUTPUT"
          else
            echo "control_plane=false" >> "$GITHUB_OUTPUT"
            echo "Preview follow-up is inert: Control Plane credentials are not configured."
          fi
      - name: Probe Preview queue without side effects
        if: ${{ steps.readiness.outputs.control_plane == 'true' }}
        id: preview_probe
        shell: bash
        run: |
          python -m ai_product_factory.runtime_cli --mode preview-probe > /tmp/preview-probe.json
          cat /tmp/preview-probe.json
          python - <<'PY'
          import json, os
          data=json.load(open("/tmp/preview-probe.json"))
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"work={'true' if data.get('claimed') else 'false'}\n")
              out.write(f"browser={'true' if data.get('preview_required') else 'false'}\n")
          PY
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: ${{ steps.preview_probe.outputs.browser == 'true' }}
        with:
          node-version: "22"
      - name: Prepare pinned Playwright with system Chrome
        if: ${{ steps.preview_probe.outputs.browser == 'true' }}
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          test -x "$FACTORY_BROWSER_EXECUTABLE_PATH"
          "$FACTORY_BROWSER_EXECUTABLE_PATH" --version
      - name: Run at most one verified Preview
        if: ${{ steps.preview_probe.outputs.work == 'true' }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode preview

  alerts:
    # Alert collector failure must be visible, but must not invalidate the
    # durable work probe or suppress ready product/dispatch/CI lanes.
    if: ${{ always() && (github.event_name == 'schedule' || (needs.schedule-probe.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.run_alerts == true)) }}
    needs: schedule-probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      PYTHONPATH: src
      FACTORY_GITHUB_ALERTS_ENABLED: "true"
      FACTORY_ALERTS_GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Detect Control Plane readiness
        id: readiness
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && { [ -n "$SUPABASE_SECRET_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            echo "control_plane=true" >> "$GITHUB_OUTPUT"
          else
            echo "control_plane=false" >> "$GITHUB_OUTPUT"
            echo "Operational alerts are inert: Control Plane credentials are not configured."
          fi
      - name: Evaluate and publish operational alerts
        if: ${{ steps.readiness.outputs.control_plane == 'true' }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode alerts

  # Owner-controlled operator recovery when scheduled wakes are delayed.
  # Exact issue-comment command; never activates scheduler/recovery/model lanes.
  alerts-owner-comment:
    if: ${{ github.event_name == 'issue_comment' && github.event.comment.body == '/factory-alerts' && github.event.comment.author_association == 'OWNER' && !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      PYTHONPATH: src
      FACTORY_GITHUB_ALERTS_ENABLED: "true"
      FACTORY_ALERTS_GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Require protected Control Plane access
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || { [ -z "${SUPABASE_SECRET_KEY:-}" ] && [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; }; then
            echo "::error::Protected Control Plane connection is unavailable."
            exit 1
          fi
      - name: Reconcile operational alerts only
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode alerts

  codex-route-preflight:
    # Independent from Primary; run only when there is actual dispatch work.
    needs: schedule-probe
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run_alerts != true) && always() && needs.schedule-probe.result == 'success' && vars.FACTORY_CODEX_ENABLED == 'true' && (needs.schedule-probe.outputs.dispatch_work == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_codex == true)) }}
    environment: openai-codex
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Verify explicitly enabled official Codex routing configuration
        id: check
        env:
          FACTORY_CODEX_ENABLED: ${{ vars.FACTORY_CODEX_ENABLED == 'true' && 'true' || 'false' }}
          OPENAI_FEDERATION_RULE_ID: ${{ vars.OPENAI_FEDERATION_RULE_ID }}
          OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          if [ "$FACTORY_CODEX_ENABLED" = "true" ] && [ -n "$FACTORY_GITHUB_TOKEN" ]; then
            if [ -n "$OPENAI_FEDERATION_RULE_ID$OPENAI_WIF_AUDIENCE" ]; then
              # Incomplete WIF MUST NOT fall back to a token.
              if [ -n "$OPENAI_FEDERATION_RULE_ID" ] && [ -n "$OPENAI_WIF_AUDIENCE" ]; then
                ready=true
              fi
            elif [ -n "$CODEX_ACCESS_TOKEN" ]; then
              ready=true
            fi
          fi
          # Presence is a configuration preflight, NOT a successful login.
          # The protected Codex worker must separately validate runtime auth.
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
