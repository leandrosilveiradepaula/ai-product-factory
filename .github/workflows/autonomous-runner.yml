        shell: bash
        env:
          PROJECT_KEY: ${{ steps.target.outputs.project_key }}
          ADMISSION_RUN_ID: ${{ steps.target.outputs.run_id }}
        run: |
          set -euo pipefail
          args=(--project-key "$PROJECT_KEY")
          if [ -n "$ADMISSION_RUN_ID" ]; then args+=(--run-id "$ADMISSION_RUN_ID"); fi
          python scripts/audit_admission_diagnostics.py "${args[@]}" \
            | tee "$RUNNER_TEMP/factory-admission-diagnosis.json"
      - name: Preserve sanitized admission artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: factory-admission-diagnosis-${{ github.run_id }}
          path: ${{ runner.temp }}/factory-admission-diagnosis.json
          if-no-files-found: warn
          retention-days: 7

  global-readiness-post-ci:
    # The Control Plane broker ALREADY allows this trusted runner OIDC identity.
    # Validate and visual completion are observer signals, NEVER scheduler wakes.
    # schedule-probe accepts workflow_run only when upstream event=schedule;
    # visual failure is observed as a blocker, never treated as verified.
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.status == 'completed' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository && ((github.event.workflow_run.name == 'validate' && github.event.workflow_run.conclusion == 'success') || (github.event.workflow_run.name == 'Authenticated Console visual evidence' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'))) }}
    environment: openai-api
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
      checks: read
      id-token: write
    env:
      PYTHONPATH: src
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: ./.github/actions/control-plane-oidc
      - name: Inspect current HEAD and independent Control Plane evaluations
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_global_readiness.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/factory-global-product-readiness.json"
      - name: Collect verified criterion evidence (read-only, no model)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_readiness_evidence_manifest.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/factory-verified-readiness-baseline.json"
      - name: Preserve sanitized global product audit receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: factory-global-readiness-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/factory-global-product-readiness.json
            ${{ runner.temp }}/factory-verified-readiness-baseline.json
          if-no-files-found: warn
          retention-days: 7

  # Trusted Github OWNER issue comment; never aliases /factory-wake.
  owner-start:
    needs: schedule-probe
    if: >-
      ${{
        always() &&
        github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        github.event.issue.number == 1055 &&
        !github.event.issue.pull_request &&
        github.event.comment.author_association == 'OWNER' &&
        github.actor == github.event.comment.user.login &&
        github.event.comment.user.id == 256917842 &&
        github.event.repository.id == 1387883686 &&
        github.event.repository.full_name == github.repository &&
        startsWith(github.event.comment.body, '/factory-start ')
      }}
    environment: openai-api
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      id-token: write
      actions: write # Limited local workflow_dispatch after committed Start
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Authenticate exact GitHub owner command before OIDC
        shell: bash
        run: |
          set -euo pipefail
          python -m ai_product_factory.github_owner_start \
            --event-path "$GITHUB_EVENT_PATH" --mode validate
      - uses: ./.github/actions/control-plane-oidc
      - name: Enqueue one atomic real owner continuation and wake existing runner
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m ai_product_factory.github_owner_start \
            --event-path "$GITHUB_EVENT_PATH" --mode enqueue \
            --output "$RUNNER_TEMP/factory-owner-start.json"
      - name: Preserve bounded owner Start receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: factory-owner-start-${{ github.run_id }}
          path: ${{ runner.temp }}/factory-owner-start.json
          if-no-files-found: warn
          retention-days: 14

  # Exact, already-failed Product Stage planning checkpoint: no repeated paid
  # reconciliation/gap calls; only the verified Github OWNER may enqueue.
  owner-resume-planning:
    needs: schedule-probe
    if: >-
      ${{
        always() &&
        github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        github.event.issue.number == 1055 &&
        !github.event.issue.pull_request &&
        github.event.comment.author_association == 'OWNER' &&
        github.actor == github.event.comment.user.login &&
        github.event.comment.user.id == 256917842 &&
        github.event.repository.id == 1387883686 &&
        github.event.repository.full_name == github.repository &&
        startsWith(github.event.comment.body, '/factory-resume-planning ')
      }}
    environment: openai-api
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      id-token: write
      actions: write
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Validate exact GitHub OWNER resume identity before OIDC
        shell: bash
        run: |
          set -euo pipefail
          python -m ai_product_factory.github_owner_resume \
            --event-path "$GITHUB_EVENT_PATH" --mode validate
      - uses: ./.github/actions/control-plane-oidc
      - name: Queue one checkpointed planning stage and wake runner
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m ai_product_factory.github_owner_resume \
            --event-path "$GITHUB_EVENT_PATH" --mode enqueue \
            --output "$RUNNER_TEMP/factory-planning-resume.json"
      - name: Preserve bounded resume receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: factory-planning-resume-${{ github.run_id }}
          path: ${{ runner.temp }}/factory-planning-resume.json
          if-no-files-found: warn
          retention-days: 14

