name: Factory autonomous runner

on:
  repository_dispatch:
    types: [factory-intake-wake]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      project_key:
        description: Optional project key for backlog dispatch
        required: false
        type: string
      run_direct:
        description: Run at most one Direct implementation task
        required: false
        default: false
        type: boolean
      run_codex:
        description: Run at most one Codex implementation task
        required: false
        default: false
        type: boolean
      run_alerts:
        description: Evaluate operational alerts and publish deduplicated GitHub Issues
        required: false
        default: false
        type: boolean
      run_preview:
        description: Run at most one verified Preview deployment
        required: false
        default: false
        type: boolean
      run_offline_preflight:
        description: "Read-only source preflight of existing Product Stage run; no agents or paid models"
        required: false
        default: false
        type: boolean
      offline_run_id:
        description: "Existing Product Stage run UUID, used only by offline preflight"
        required: false
        type: string
      run_journey_audit:
        description: "ONLY audit an existing human Start; never initiate work"
        required: false
        default: false
        type: boolean
      journey_since_utc:
        description: "UTC Start cutoff, required only in read-only journey mode"
        required: false
        type: string
      journey_run_id:
        description: "Optional exact operator Start bootstrap run UUID"
        required: false
        type: string
      run_admission_diagnosis:
        description: "Read-only per-project/run work admission; no scheduler or models"
        required: false
        default: false
        type: boolean
      admission_run_id:
        description: "Optional exact run UUID for admission diagnosis"
        required: false
        type: string
      journey_stage:
        description: "Minimum verified stage, read-only journey mode"
        required: false
        type: choice
        default: manual_start
        options:
          - manual_start
          - discovery
          - specification
          - planning
          - routing
          - implementation
          - review
          - github_ci
          - preview
          - awaiting_release
          - human_release_observed
          - operations
  workflow_run:
    # Reuses existing trusted six-hour OIDC preflight cron, no new timer.
    workflows: ["Control Plane OIDC preflight", "validate", "Authenticated Console visual evidence"]
    types: [completed]
    branches: [main]
  schedule:
    # Independent staggered wake opportunities: GitHub may delay or drop scheduled events.
    # This is best-effort redundancy, not a guaranteed 30-minute SLA.
    - cron: "17 * * * *"
    - cron: "47 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: factory-autonomous-runner
  cancel-in-progress: false

jobs:
  schedule-probe:
    # In audit-only mode skip the scheduler probe and ALL dependent workers.
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.run_journey_audit != true && inputs.run_offline_preflight != true && inputs.run_admission_diagnosis != true)) && (github.event_name != 'issue_comment' || (github.event.comment.body == '/factory-wake' && github.event.comment.author_association == 'OWNER')) && (github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository)) && (github.event_name != 'repository_dispatch' || (github.actor == 'infodive-ai-product-factory[bot]' && github.event.action == 'factory-intake-wake' && github.event.client_payload.source == 'console-intake')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      github_access_work: ${{ steps.probe.outputs.github_access_work }}
      product_work: ${{ steps.probe.outputs.product_work }}
      dispatch_work: ${{ steps.probe.outputs.dispatch_work }}
      integration_work: ${{ steps.probe.outputs.integration_work }}
      ci_work: ${{ steps.probe.outputs.ci_work }}
      specialist_work: ${{ steps.probe.outputs.specialist_work }}
      specialist_security_work: ${{ steps.probe.outputs.specialist_security_work }}
      specialist_qa_work: ${{ steps.probe.outputs.specialist_qa_work }}
      specialist_operations_work: ${{ steps.probe.outputs.specialist_operations_work }}
      preview_work: ${{ steps.probe.outputs.preview_work }}
      release_work: ${{ steps.probe.outputs.release_work }}
      codex_manual_work: ${{ steps.probe.outputs.codex_manual_work }}
      work_detected: ${{ steps.probe.outputs.work_detected }}
    env:
      PYTHONPATH: src
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      FACTORY_GITHUB_ALERTS_ENABLED: "true"
      FACTORY_ALERTS_GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Authenticate exact owner wake for deterministic settlement
        id: owner_wake
        # Two independent fences: top-level job gate and this explicit receipt.
        # Untrusted comments never enable release/Control Plane mutations.
        if: ${{ github.event_name == 'issue_comment' && github.event.comment.body == '/factory-wake' && github.event.comment.author_association == 'OWNER' }}
        shell: bash
        run: echo 'verified=true' >> "$GITHUB_OUTPUT"
      - name: Verify backup scheduler wake is necessary
        if: ${{ github.event_name == 'workflow_run' }}
        id: backup_wake
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from ai_product_factory.supabase_scheduler_liveness import (
              SupabaseSchedulerLivenessReader, evaluate_scheduler_liveness
          )
          liveness = SupabaseSchedulerLivenessReader().read()
          needed = any(a.code == "scheduler_gap"
                       for a in evaluate_scheduler_liveness(liveness))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("wake=" + ("true" if needed else "false") + "\n")
          print("backup_wake_needed=" + ("true" if needed else "false"))
          PY
      - name: Recover expired leases in the shared scheduler runner
        if: ${{ github.event_name == 'schedule' || github.event_name == 'issue_comment' || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.run_alerts != true) || (github.event_name == 'workflow_run' && steps.backup_wake.outputs.wake == 'true') }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode recovery --max-attempts 3
      - name: Settle quiescent manual project controls
        if: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && steps.backup_wake.outputs.wake == 'true') || (github.event_name == 'issue_comment' && steps.owner_wake.outputs.verified == 'true') }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode project-control-settle
      - name: Settle only previously observed human release state
        # This scan only reads a service-role-only, durable release outbox.
        # It does not claim runs, merge GitHub PRs, create projects or call models.
        if: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && steps.backup_wake.outputs.wake == 'true') || (github.event_name == 'issue_comment' && steps.owner_wake.outputs.verified == 'true') }}
        continue-on-error: true
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode release-state-settle --batch-items 4
      - name: Repair readiness for current verified legacy human releases
        # Optional SQL capability: before its authorized migration, the
        # bounded command reports blocked_migration_not_applied with zero writes.
        # No queue claim, GitHub write, Preview, paid model, or pull-request merge.
        if: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && steps.backup_wake.outputs.wake == 'true') || (github.event_name == 'issue_comment' && steps.owner_wake.outputs.verified == 'true') }}
        continue-on-error: true
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode legacy-release-readiness-repair --batch-items 4
      - name: Observe committed project control wake
        if: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.run_alerts != true) || (github.event_name == 'workflow_run' && steps.backup_wake.outputs.wake == 'true') || (github.event_name == 'issue_comment' && steps.owner_wake.outputs.verified == 'true') }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode project-control-wake --worker-id "gha-control-${{ github.run_id }}"
      - name: Resolve durable Journey V2 sources before any queue claim
        # Existing runner lane, GET-only against GitHub followed by an
        # epoch/policy-fenced Control Plane CAS. It never calls a model.
        if: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.run_alerts != true) || (github.event_name == 'workflow_run' && steps.backup_wake.outputs.wake == 'true') || (github.event_name == 'issue_comment' && steps.owner_wake.outputs.verified == 'true') }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode journey-source-resolve --max-items 4
      - name: Probe durable work queues without side effects
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run_alerts != true) && (github.event_name != 'workflow_run' || steps.backup_wake.outputs.wake == 'true') }}
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          python -m ai_product_factory.runtime_cli --mode schedule-probe > /tmp/factory-schedule-probe.json
          cat /tmp/factory-schedule-probe.json
          python - <<'PY'
          import json, os
          data=json.load(open("/tmp/factory-schedule-probe.json"))
          keys=(
              "github_access_work","product_work","dispatch_work","integration_work","ci_work",
              "specialist_work","specialist_security_work","specialist_qa_work",
              "specialist_operations_work","preview_work","release_work",
              "codex_manual_work","work_detected",
          )
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              for key in keys:
                  out.write(f"{key}={'true' if data.get(key) else 'false'}\n")
          PY
      - name: Reconcile externally authenticated wake intents after authoritative probe
        if: ${{ steps.probe.outcome == 'success' && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' || github.event_name == 'issue_comment') }}
        shell: bash
        env:
          FACTORY_TRUSTED_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.error
          from ai_product_factory.external_webhook_recovery import reconcile_external_wakes
          with open("/tmp/factory-schedule-probe.json",encoding="utf-8") as fh:
              signal=json.load(fh)
          keys=("ci_work","preview_work","release_work")
          if any(type(signal.get(key)) is not bool for key in keys):
              raise SystemExit("missing authoritative queue probe")
          try:
              receipt=reconcile_external_wakes(
                  workflow_run_id=int(os.environ["FACTORY_TRUSTED_RUN_ID"]),
                  ci_work=signal["ci_work"],preview_work=signal["preview_work"],
                  release_work=signal["release_work"])
          except urllib.error.HTTPError as error:
              if error.code in (404,428):
                  print("EXTERNAL_WAKE_RECOVERY=BLOCKED_MIGRATION_NOT_APPLIED")
              else:
                  raise
          else:
              print("EXTERNAL_WAKE_RECOVERY="+json.dumps(receipt,sort_keys=True))
          PY
      - name: Diagnose historical queued backlog without dispatch
        if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_run' && steps.backup_wake.outputs.wake == 'true')) && steps.probe.outputs.work_detected == 'false' }}
        continue-on-error: true
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode backlog-audit
  github-access-preflight:
    environment: openai-api
    needs: schedule-probe
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run_alerts != true) && always() && needs.schedule-probe.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.schedule-probe.outputs.github_access_work == 'true' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      issues: read
      pull-requests: read
      actions: read
      statuses: read
      checks: read
    env:
      PYTHONPATH: src
      GITHUB_TOKEN: ${{ github.token }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify one project GitHub capability contract
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && { [ -n "$SUPABASE_SECRET_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            if [ -n "${{ inputs.project_key }}" ]; then
              python -m ai_product_factory.runtime_cli --mode github-preflight --project-key "${{ inputs.project_key }}"
            else
              python -m ai_product_factory.runtime_cli --mode github-preflight
            fi
          else
            echo "GitHub capability preflight is inert: Control Plane credentials are not configured."
          fi

  # Candidate reconciliation is separate from queue admission and model lanes.
  # Schedule wakes work automatically; the exact owner-only issue comment
  # provides a bounded, auditable smoke run when GitHub drops cron events.
  candidate-repin:
    if: >-
      ${{
        github.event_name == 'schedule' ||
        (github.event_name == 'issue_comment' &&
         github.event.comment.body == '/factory-candidate-repin' &&
         github.event.comment.author_association == 'OWNER' &&
         github.actor == github.event.comment.user.login &&
         github.event.repository.full_name == github.repository)
      }}
    environment: openai-api
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
      issues: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    env:
      PYTHONPATH: src
      GITHUB_TOKEN: ${{ github.token }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Settle proven terminal CI repair sources (migration gated, no model)
        shell: bash
        run: python scripts/settle_terminal_ci_repairs.py --max-items 3
      - name: Requeue verified exact-scope misresolutions (migration gated, no model)
        shell: bash
        run: python scripts/resume_blocked_literal_scopes.py --max-items 2
      - name: Requeue proven missing repin context (migration gated, no model)
        shell: bash
        run: python scripts/resume_blocked_repin_context.py --max-items 2
      - name: Requeue proven CI-repair candidate preflight mismatch (migration gated, model-free)
        shell: bash
        run: python scripts/resume_blocked_ci_repair_candidate.py --max-items 2
      - name: Reconcile up to three explicitly enabled existing candidates
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python -m ai_product_factory.runtime_cli --mode candidate-repin --max-items 3 > /tmp/factory-candidate-repin.json
          exit_code=$?
          set -e
          if [ -s /tmp/factory-candidate-repin.json ]; then
            python scripts/summarize_candidate_repin_run.py /tmp/factory-candidate-repin.json
          else
            echo "::error title=Candidate reconciliation::No structured receipt was produced"
          fi
          if [ "$exit_code" -ne 0 ]; then
            echo "::error title=Candidate reconciliation::One or more candidates were blocked or failed; consult the bounded result"
            exit "$exit_code"
          fi
          test -s /tmp/factory-candidate-repin.json

  # Human-merged PR -> new source-only Preview bootstrap with immutable release
  # evidence. No model, Change Set replay or merge permissions on this job.
  rotate-released-existing-source:
    needs: schedule-probe
    if: >-
      ${{
        always() &&
        github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        github.event.issue.number == 713 &&
        !github.event.issue.pull_request &&
        github.event.comment.author_association == 'OWNER' &&
        github.actor == 'leandrosilveiradepaula' &&
        github.event.comment.user.id == 256917842 &&
        startsWith(github.event.comment.body, '/factory-rotate-released-candidate ')
      }}
    environment: openai-api
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify exact OWNER issue event before protected OIDC
        run: python scripts/rotate_released_existing_candidate.py --event-path "$GITHUB_EVENT_PATH" --check-event
      - uses: ./.github/actions/control-plane-oidc
      - name: Verify human merge, new scoped PR and native CI; execute CAS once
        env:
          FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
        run: >-
          python scripts/rotate_released_existing_candidate.py
          --event-path "$GITHUB_EVENT_PATH"
          --output "$RUNNER_TEMP/factory-released-source-rotation.json"
      - name: Preserve sanitized epoch-fenced rotation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: factory-released-source-rotation-${{ github.run_id }}
          path: ${{ runner.temp }}/factory-released-source-rotation.json
          if-no-files-found: warn
          retention-days: 7



  product-stage:
    needs: schedule-probe
    outputs:
      primary_ready: ${{ steps.readiness.outputs.primary_model }}
      dispatch_work: ${{ steps.post_product_probe.outputs.dispatch_work }}
    # Auth preflight is also needed when the only work is already planned.
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run_alerts != true) && always() && needs.schedule-probe.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.schedule-probe.outputs.product_work == 'true' || needs.schedule-probe.outputs.dispatch_work == 'true') }}
    runs-on: ubuntu-latest
    environment: openai-api
    permissions:
      contents: read
      id-token: write
      issues: read
    timeout-minutes: 8
    env:
      PYTHONPATH: src
      GITHUB_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
      OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
      OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
      FACTORY_PRIMARY_AUTH_MODE: api_key
      # Never imply paid authorization from a secret alone; unset GitHub variable stays off.
      FACTORY_PRIMARY_MODEL_ENABLED: ${{ vars.FACTORY_PRIMARY_MODEL_ENABLED == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Detect runtime readiness
        id: readiness
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && { [ -n "$SUPABASE_SECRET_KEY" ] || [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            echo "control_plane=true" >> "$GITHUB_OUTPUT"
          else
            echo "control_plane=false" >> "$GITHUB_OUTPUT"
          fi
          primary_auth=false
          case "$FACTORY_PRIMARY_AUTH_MODE" in
            api_key)
              [ -n "$OPENAI_API_KEY" ] && primary_auth=true
              ;;
            wif)
              if [ -n "$OPENAI_IDENTITY_PROVIDER_ID" ] && [ -n "$OPENAI_SERVICE_ACCOUNT_ID" ] && [ -n "$OPENAI_WIF_AUDIENCE" ]; then
                primary_auth=true
              fi
              ;;
            auto|"")
              if [ -n "$OPENAI_IDENTITY_PROVIDER_ID$OPENAI_SERVICE_ACCOUNT_ID$OPENAI_WIF_AUDIENCE" ]; then
                if [ -n "$OPENAI_IDENTITY_PROVIDER_ID" ] && [ -n "$OPENAI_SERVICE_ACCOUNT_ID" ] && [ -n "$OPENAI_WIF_AUDIENCE" ]; then
                  primary_auth=true
                fi
              elif [ -n "$OPENAI_API_KEY" ]; then
                primary_auth=true
              fi
              ;;
            *) primary_auth=false ;;
          esac
          # The independent Product Stage preflight fetches the currently
          # approved primary budget from the Control Plane and rejects a
          # missing/stale policy before any paid claim.
          if [ "$FACTORY_PRIMARY_MODEL_ENABLED" = "true" ] \
             && [ "$primary_auth" = "true" ]; then
            echo "primary_model=true" >> "$GITHUB_OUTPUT"
          else
            echo "primary_model=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Report blocked dependencies
        if: ${{ steps.readiness.outputs.control_plane != 'true' || steps.readiness.outputs.primary_model != 'true' }}
        shell: bash
        run: |
          echo "Factory runner is healthy but blocked by external configuration."
          echo "control_plane=${{ steps.readiness.outputs.control_plane }}"
          echo "primary_model=${{ steps.readiness.outputs.primary_model }}"
      - name: Report runtime health
        if: ${{ steps.readiness.outputs.control_plane == 'true' }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode health
      - name: Recover expired worker leases
        if: ${{ steps.readiness.outputs.control_plane == 'true' }}
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode recovery --max-attempts 3
      - name: Record run-linked Product Stage readiness without paid model calls
        id: product_readiness_evidence
        if: ${{ steps.readiness.outputs.control_plane == 'true' && (needs.schedule-probe.outputs.product_work == 'true' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        run: |
          set -euo pipefail
          python -m ai_product_factory.runtime_cli --mode product-readiness-evidence > /tmp/factory-product-readiness-evidence.json
          cat /tmp/factory-product-readiness-evidence.json
          python - <<'PY'
          import json, os
          data=json.load(open('/tmp/factory-product-readiness-evidence.json'))
          ready=data.get('ready') is True
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('ready=' + ('true' if ready else 'false') + '\n')
          if not ready:
              reason=str(data.get('reason_code') or 'readiness_unknown')
              print('::warning title=Product Stage blocked::' + reason)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
                  out.write('### Product Stage: blocked, not executed\n')
                  out.write('Reason: ' + reason + '; run audits: ' + str(data.get('recorded', 0)) + '. No paid model call.\n')
          PY
      - name: Process at most one product-stage run
        id: product_run
        # Do not call the model merely to check dispatch-only readiness.
        if: ${{ steps.readiness.outputs.control_plane == 'true' && steps.readiness.outputs.primary_model == 'true' && steps.product_readiness_evidence.outputs.ready == 'true' && (needs.schedule-probe.outputs.product_work == 'true' || github.event_name == 'workflow_dispatch') }}
        shell: bash
        run: |
          set -euo pipefail
