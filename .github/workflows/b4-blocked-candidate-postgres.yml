name: B4 blocked-release candidate PostgreSQL QA

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/*reconcile_blocked_release_candidate_once.sql"
      - "src/ai_product_factory/blocked_release_candidate_reconciliation.py"
      - "scripts/reconcile_blocked_release_candidate.py"
      - "scripts/verify_blocked_release_candidate_postgres.py"
      - "tests/test_blocked_release_candidate_reconciliation.py"
      - ".github/workflows/b4-blocked-candidate-postgres.yml"

permissions:
  contents: read

jobs:
  b4-blocked-candidate-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: factory_blocked_candidate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_blocked_candidate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Verify source-bound GitHub preflight negatives
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_blocked_release_candidate_reconciliation.py'
      - name: Verify one-shot CAS, ACLs, immutable history and adversarial rollback
        env:
          FACTORY_BLOCKED_CANDIDATE_ISOLATED: "true"
          FACTORY_BLOCKED_CANDIDATE_TEST_DSN: "postgresql://factory_ci:disposable-only@127.0.0.1:5432/factory_blocked_candidate_test"
        run: python scripts/verify_blocked_release_candidate_postgres.py
