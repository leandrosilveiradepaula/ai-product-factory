name: Block 1 independent secret scanner
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install exact independent Gitleaks CLI without licensed Action
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          install -d /tmp/gitleaks-8.24.3
          install -m 755 "$(go env GOPATH)/bin/gitleaks" /tmp/gitleaks-8.24.3/gitleaks
          /tmp/gitleaks-8.24.3/gitleaks version | grep -F '8.24.3'
      - name: Scan PR/history with independent Gitleaks engine
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -x /tmp/gitleaks-8.24.3/gitleaks
          test "$HEAD_SHA" = "$(git rev-parse HEAD)"
          if [ -n "$BASE_SHA" ]; then
            git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
            /tmp/gitleaks-8.24.3/gitleaks git --log-opts="$BASE_SHA..$HEAD_SHA" \\
              --redact --no-banner --exit-code 2 .
          else
            /tmp/gitleaks-8.24.3/gitleaks git --log-opts="-1 $HEAD_SHA" \\
              --redact --no-banner --exit-code 2 .
          fi
      - name: Scan complete exact commit tree independently of PR diff
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python scripts/audit_block1_complete_tree.py \
            --output block1-full-tree-scan-receipt.json
      - name: Reject privileged credential flow to public Console surfaces
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_block1_credential_exposure.py \
            > block1-credential-exposure-receipt.json
      - name: Retain SHA and Git tree-bound sanitized scan result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: block1-full-tree-gitleaks
          path: |
            block1-full-tree-scan-receipt.json
            block1-credential-exposure-receipt.json
          if-no-files-found: warn
          retention-days: 14
