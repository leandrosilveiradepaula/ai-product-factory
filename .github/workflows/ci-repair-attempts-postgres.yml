name: CI repair attempts PostgreSQL QA
on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/*durable_ci_repair_requests.sql"
      - "scripts/verify_ci_repair_attempts_postgres.py"
      - "scripts/verify_ci_repair_e2e_postgres.py"
      - "supabase/migrations/*ci_repair_replay_idempotency.sql"
      - "supabase/migrations/*ci_repair_cumulative_scopes.sql"
      - "supabase/migrations/*verified_native_ci_test_scope.sql"
      - "src/ai_product_factory/ci_native_test_contract.py"
      - "src/ai_product_factory/ci_repair_queue.py"
      - "tests/test_ci_native_test_contract.py"
      - ".github/workflows/ci-repair-attempts-postgres.yml"
permissions:
  contents: read
jobs:
  ci-repair-attempts-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: factory_ci
          POSTGRES_DB: factory_ci_repair_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_ci_repair_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Verify bounded attempts in disposable PostgreSQL
        env:
          FACTORY_CI_REPAIR_TEST_ISOLATED: "true"
          FACTORY_CI_REPAIR_TEST_DSN: "postgresql://factory_ci:factory_ci@127.0.0.1:5432/factory_ci_repair_test"
        run: python scripts/verify_ci_repair_attempts_postgres.py

  ci-repair-e2e-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: factory_ci
          POSTGRES_DB: factory_ci_repair_e2e_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_ci_repair_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Exercise exact migrations and CI repair idempotency in disposable PG16
        env:
          FACTORY_CI_REPAIR_E2E_ISOLATED: "true"
          FACTORY_CI_REPAIR_E2E_DSN: "postgresql://factory_ci:factory_ci@127.0.0.1:5432/factory_ci_repair_e2e_test"
        run: python scripts/verify_ci_repair_e2e_postgres.py
