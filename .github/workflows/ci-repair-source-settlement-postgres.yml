name: Terminal CI repair source settlement PostgreSQL QA

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/*settle_terminal_ci_repair_sources.sql"
      - "src/ai_product_factory/ci_repair_source_settlement.py"
      - "scripts/settle_terminal_ci_repairs.py"
      - "scripts/verify_terminal_ci_repair_source_postgres.py"
      - "tests/test_ci_repair_source_settlement.py"
      - ".github/workflows/ci-repair-source-settlement-postgres.yml"

permissions:
  contents: read

jobs:
  terminal-ci-repair-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: factory_repair_settlement_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_repair_settlement_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Verify historical repair settlement in disposable PostgreSQL
        env:
          FACTORY_REPAIR_SETTLEMENT_ISOLATED: "true"
          FACTORY_REPAIR_SETTLEMENT_DSN: "postgresql://factory_ci:disposable-only@127.0.0.1:5432/factory_repair_settlement_test"
        run: python scripts/verify_terminal_ci_repair_source_postgres.py
