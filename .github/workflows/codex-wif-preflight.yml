name: Codex auth preflight

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: codex-wif-preflight
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: openai-codex
    timeout-minutes: 8
    env:
      OPENAI_FEDERATION_RULE_ID: ${{ vars.OPENAI_FEDERATION_RULE_ID }}
      OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
      OPENAI_WORKLOAD_IDENTITY_CONTEXT: '{"instance_id":"github-actions-preflight","display_name":"ai-product-factory","labels":{"repository":"ai-product-factory","environment":"openai-codex"}}'
      FACTORY_CODEX_GITHUB_ENVIRONMENT: openai-codex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select official Codex authentication
        id: auth
        env:
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
        shell: bash
        run: |
          auth_mode=none
          if [ -n "$OPENAI_FEDERATION_RULE_ID$OPENAI_WIF_AUDIENCE" ]; then
            if [ -n "$OPENAI_FEDERATION_RULE_ID" ] && [ -n "$OPENAI_WIF_AUDIENCE" ]; then
              auth_mode=wif
              echo "OPENAI_IDENTITY_TOKEN_FILE=/home/runner/work/_temp/openai-wif/identity-token" >> "$GITHUB_ENV"
            else
              echo "Codex WIF is partially configured; refusing access-token fallback."
              exit 2
            fi
          elif [ -n "$CODEX_ACCESS_TOKEN" ]; then
            auth_mode=access_token
          else
            echo "No official Codex authentication is configured."
            exit 2
          fi
          echo "mode=$auth_mode" >> "$GITHUB_OUTPUT"
          echo "auth_mode=$auth_mode"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Request and validate GitHub OIDC token
        if: ${{ steps.auth.outputs.mode == 'wif' }}
        env:
          PYTHONPATH: src
        shell: bash
        run: python -m ai_product_factory.codex_oidc

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Install compatible Codex CLI
        shell: bash
        run: |
          npm install -g @openai/codex@0.157.0
          VERSION="$(codex --version)"
          echo "$VERSION"
          python - <<'PY'
          import re, subprocess
          text=subprocess.check_output(["codex","--version"], text=True)
          match=re.search(r"(\d+)\.(\d+)\.(\d+)", text)
          if not match or tuple(map(int,match.groups())) < (0,148,0):
              raise SystemExit("Codex WIF requires Codex 0.148.0 or newer")
          PY

      - name: Verify Codex authentication
        env:
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
        shell: bash
        run: codex login status
