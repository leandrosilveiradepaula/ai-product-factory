name: Console browser evidence

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Exact existing Vercel Preview URL to verify
        required: true
        type: string
      expected_text:
        description: Text that must be rendered by the application
        required: false
        default: "Entrar na Factory"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  browser-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Install pinned Playwright package
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version
      - name: Mint short-lived GitHub OIDC token
        id: oidc
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput("token", token);
      - name: Resolve exact Preview target
        id: target
        env:
          INPUT_PREVIEW_URL: ${{ inputs.preview_url }}
          INPUT_EXPECTED_TEXT: ${{ inputs.expected_text }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const previewUrl = process.env.INPUT_PREVIEW_URL || "";
          const expectedText = process.env.INPUT_EXPECTED_TEXT || "Entrar na Factory";
          if (!/^https:\/\/[a-z0-9.-]+\.vercel\.app\/?$/i.test(previewUrl)) throw new Error("preview target must be an https vercel.app URL");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "preview_url=" + previewUrl + "\n");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "expected_text=" + expectedText.replace(/\r?\n/g, " ") + "\n");
          NODE
      - name: Verify exact protected Preview
        env:
          FACTORY_PREVIEW_URL: ${{ steps.target.outputs.preview_url }}
          FACTORY_PREVIEW_EXPECTED_TEXT: ${{ steps.target.outputs.expected_text }}
          FACTORY_VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          FACTORY_BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome
        shell: bash
        run: |
          result="$(node scripts/verify_preview.mjs)"
          echo "$result"
          RESULT="$result" node - <<'NODE'
          const result = JSON.parse(process.env.RESULT);
          const required = ["page_load", "http_status", "body_visible", "expected_text", "console_clean"];
          if (result.status !== "success") {
            throw new Error(result.detail || "browser evidence failed");
          }
          for (const check of required) {
            if (!result.checks.includes(check)) throw new Error(`missing browser evidence check: ${check}`);
          }
          NODE
