name: Console browser evidence

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/console-browser-evidence.yml"
      - ".github/preview-target.json"
      - "scripts/verify_preview.mjs"
  workflow_dispatch:
    inputs:
      preview_url:
        description: Exact existing Vercel Preview URL to verify
        required: false
        default: "https://ai-product-factory-console-fnr4yyuyr-leandros-projects-102e32ab.vercel.app"
        type: string
      expected_text:
        description: Text that must be rendered by the application
        required: false
        default: "Entrar na Factory"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  browser-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Install pinned Playwright browser
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Mint short-lived GitHub OIDC token
        id: oidc
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput("token", token);
      - name: Resolve exact Preview target
        id: target
        env:
          INPUT_PREVIEW_URL: ${{ inputs.preview_url }}
          INPUT_EXPECTED_TEXT: ${{ inputs.expected_text }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = ".github/preview-target.json";
          const pushTarget = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, "utf8")) : {};
          const previewUrl = process.env.INPUT_PREVIEW_URL || pushTarget.preview_url || "";
          const expectedText = process.env.INPUT_EXPECTED_TEXT || pushTarget.expected_text || "Entrar na Factory";
          const candidateSha = pushTarget.candidate_sha || "";
          if (!/^https:\/\/[a-z0-9.-]+\.vercel\.app\/?$/i.test(previewUrl)) throw new Error("preview target must be an https vercel.app URL");
          if (process.env.GITHUB_EVENT_NAME === "push" && !/^[0-9a-f]{40}$/.test(candidateSha)) throw new Error("push evidence target must include exact candidate_sha");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "preview_url=" + previewUrl + "\n");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "expected_text=" + expectedText.replace(/\r?\n/g, " ") + "\n");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "candidate_sha=" + candidateSha + "\n");
          NODE
      - name: Verify candidate commit exists
        if: github.event_name == 'push'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CANDIDATE_SHA: ${{ steps.target.outputs.candidate_sha }}
        with:
          script: |
            await github.rest.repos.getCommit({...context.repo, ref: process.env.CANDIDATE_SHA});
            core.notice("Browser evidence target candidate: " + process.env.CANDIDATE_SHA);
      - name: Verify exact protected Preview
        env:
          FACTORY_PREVIEW_URL: ${{ steps.target.outputs.preview_url }}
          FACTORY_PREVIEW_EXPECTED_TEXT: ${{ steps.target.outputs.expected_text }}
          FACTORY_VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          result="$(node scripts/verify_preview.mjs)"
          echo "$result"
          RESULT="$result" node - <<'NODE'
          const result = JSON.parse(process.env.RESULT);
          const required = ["page_load", "http_status", "body_visible", "expected_text", "console_clean"];
          if (result.status !== "success") {
            throw new Error(result.detail || "browser evidence failed");
          }
          for (const check of required) {
            if (!result.checks.includes(check)) throw new Error(`missing browser evidence check: ${check}`);
          }
          NODE
