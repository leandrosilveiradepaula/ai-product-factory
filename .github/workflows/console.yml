name: Console validation
on:
  push:
    branches: [main, 'release/**']
    paths:
      - "apps/console/**"
      - ".github/workflows/console.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/console/**"
      - ".github/workflows/console.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v7
      - name: Enforce Console branch convention
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          case "${GITHUB_HEAD_REF}" in
            console/*|ci/*|test/*|security/*|agents/*|release/*) ;;
            preview/*) echo "::error::preview/** refs are reserved for promoted release candidates."; exit 1 ;;
            *) echo "::error::Console/config changes must use console/*, ci/*, test/*, security/*, agents/*, or release/*; preview/** is reserved for final candidates."; exit 1 ;;
          esac
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
