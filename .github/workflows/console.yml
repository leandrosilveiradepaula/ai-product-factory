name: Console validation
on:
  push:
    branches: [main, 'release/**']
    paths:
      - "apps/console/**"
      - ".github/workflows/console.yml"
      - "src/ai_product_factory/dependency_audit.py"
      - "config/console_dependency_audit_exceptions.json"
      - "tests/test_dependency_audit.py"
  pull_request:
    # Draft -> Ready has no push. Re-run unprivileged Console CI so the existing
    # trusted workflow_run promoter can inspect exact candidate and cooldown.
    # Preserve all original default pull_request activity types explicitly.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "apps/console/**"
      - ".github/workflows/console.yml"
      - "src/ai_product_factory/dependency_audit.py"
      - "config/console_dependency_audit_exceptions.json"
      - "tests/test_dependency_audit.py"
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Enforce Console branch convention
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          case "${GITHUB_HEAD_REF}" in
            console/*|ci/*|test/*|security/*|agents/*|intelligence/*|quality/*|policy/*|runtime/*|operations/*|observability/*|audit/*|release/*) ;;
            dependabot/*)
              # Enforce authenticated bot identity and trusted origin for read-only CI.
              if [ "$PR_AUTHOR_LOGIN" != "dependabot[bot]" ] || [ "$PR_HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
                echo "::error::dependabot/** requires the real Dependabot author in this repository."
                exit 1
              fi
              ;;
            preview/*) echo "::error::preview/** refs are reserved for promoted release candidates."; exit 1 ;;
            *) echo "::error::Console/config changes must use an approved technical branch namespace; preview/** is reserved for final candidates."; exit 1 ;;
          esac
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "apps/console/package-lock.json"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Test exact Console visual target and deployment identity guards
        run: node ../../scripts/test_console_visual_deployment.mjs
      - name: Test complete operational health reader
        run: node ../../scripts/test_console_operational_health.cjs
      - name: Test real Console status and accessibility semantics
        run: node ../../scripts/test_console_status_semantics.cjs
      - name: Verify actual migration feedback modules with offline delayed audit
        run: node ../../scripts/test_console_migration_interaction.cjs
      # Actual React 19 formStatus and ConfirmSubmit in headless Chromium.
      # Local-only HTTP fixture; no Supabase, credentials or production gate.
      - name: Verify migration pending success and failure in isolated Chromium
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          FACTORY_BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund esbuild@0.25.12 playwright@1.63.0
          node --test ../../scripts/test_console_migration_browser.cjs
      - name: Prove GitHub App access verification is POST-only and same-origin
        run: node ../../scripts/test_console_github_app_verify.cjs
      - name: Syntax-check protected browser capture offline, without credentials
        run: node --check ../../scripts/capture_authenticated_console.mjs
      - name: Test read-only Console accessibility receipt contracts
        run: node ../../scripts/test_console_accessibility_contract.mjs
      - name: Test real new-project upload accessible name and disclosure
        run: node ../../scripts/test_console_intake_upload_accessibility.cjs
      - name: Capture production dependency audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=moderate --json > dependency-audit.json
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "::error::npm audit failed with operational exit code $status"
            cat dependency-audit.json
            exit "$status"
          fi
      - name: Enforce dependency audit policy
        env:
          PYTHONPATH: ../../src
        run: >-
          python -m ai_product_factory.dependency_audit
          --audit dependency-audit.json
          --lock package-lock.json
          --policy ../../config/console_dependency_audit_exceptions.json
      - run: npm run typecheck
      - run: npm run build
