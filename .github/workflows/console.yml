name: Console validation
on:
  push:
    branches: [main]
    paths:
      - "apps/console/**"
      - ".github/workflows/console.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/console/**"
      - ".github/workflows/console.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Console branch convention
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          case "${GITHUB_HEAD_REF}" in
            console/*) ;;
            *) echo "::error::Changes under apps/console/** must use a console/* branch so Vercel Preview remains explicit and bounded."; exit 1 ;;
          esac
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
