name: Control Plane OIDC preflight

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/control-plane-oidc-preflight.yml"
      - ".github/actions/control-plane-oidc/action.yml"
      - "supabase/functions/factory-runtime-control-plane/**"

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scheduler_gap: ${{ steps.scheduler_health.outputs.scheduler_gap }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - name: Verify fail-closed Control Plane read
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error -o /tmp/control-plane.json -w "%{http_code}" -H "Authorization: Bearer $SUPABASE_SECRET_KEY" "$SUPABASE_URL/rest/v1/factory_projects?select=project_key&order=project_key.asc&limit=5")"
          body="$(cat /tmp/control-plane.json)"
          if [ "$status" != "200" ]; then
            echo "Control Plane broker returned HTTP $status"
            BODY="$body" python -c 'import json,os; d=json.loads(os.environ["BODY"]); print(json.dumps({"error":d.get("error"),"detail":d.get("detail")}))'
            exit 1
          fi
          BODY="$body" python -c 'import json,os; rows=json.loads(os.environ["BODY"]); assert isinstance(rows,list), "Control Plane response is not a list"; keys={str(r.get("project_key") or "") for r in rows}; assert "ai-product-factory" in keys, "Expected Factory project is not readable through OIDC broker"; print(json.dumps({"status":"ok","projects":sorted(keys)}))'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: ${{ github.event_name == 'schedule' }}
        with:
          python-version: "3.12"
      - name: Probe missing Factory scheduler wakeups read-only
        if: ${{ github.event_name == 'schedule' }}
        id: scheduler_health
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from ai_product_factory.supabase_scheduler_liveness import (
              SupabaseSchedulerLivenessReader, evaluate_scheduler_liveness,
          )
          state = SupabaseSchedulerLivenessReader().read()
          alerts = evaluate_scheduler_liveness(state)
          has_gap = any(a.code == "scheduler_gap" for a in alerts)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"scheduler_gap={'true' if has_gap else 'false'}\n")
          print(f"read_only_scheduler_gap={'true' if has_gap else 'false'}")
          PY

  # Backup observer reuses the existing six-hour OIDC preflight schedule.
  # It is not an independent scheduler and must never dispatch work.
  scheduler-gap-fallback:
    needs: preflight
    if: ${{ github.event_name == 'schedule' && needs.preflight.result == 'success' && needs.preflight.outputs.scheduler_gap == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      issues: write
    concurrency:
      group: factory-scheduler-gap-fallback
      cancel-in-progress: false
    env:
      PYTHONPATH: src
      FACTORY_GITHUB_ALERTS_ENABLED: "true"
      FACTORY_ALERTS_GITHUB_REPOSITORY: ${{ github.repository }}
      FACTORY_MODEL_BUDGET_USD: "4.00"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Publish or reconcile operational alerts without dispatch
        shell: bash
        run: python -m ai_product_factory.runtime_cli --mode alerts

  vercel-quota:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      FACTORY_VERCEL_TEAM_ID: ${{ vars.FACTORY_VERCEL_TEAM_ID }}
    steps:
      - name: Detect optional Vercel usage credentials
        id: readiness
        shell: bash
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ] && [ -n "${FACTORY_VERCEL_TEAM_ID:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel usage collection is optional and skipped because its read-only credentials are not configured."
          fi
      - if: steps.readiness.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: steps.readiness.outputs.enabled == 'true'
        uses: ./.github/actions/control-plane-oidc
      - if: steps.readiness.outputs.enabled == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Record rolling 24 hour Vercel deployment usage
        if: steps.readiness.outputs.enabled == 'true'
        run: python scripts/collect_vercel_usage.py
