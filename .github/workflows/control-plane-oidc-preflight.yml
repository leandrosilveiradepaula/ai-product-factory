name: Control Plane OIDC preflight

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/control-plane-oidc-preflight.yml"
      - ".github/actions/control-plane-oidc/action.yml"
      - "supabase/functions/factory-runtime-control-plane/**"

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - name: Verify fail-closed Control Plane read
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error -o /tmp/control-plane.json -w "%{http_code}" -H "Authorization: Bearer $SUPABASE_SECRET_KEY" "$SUPABASE_URL/rest/v1/factory_projects?select=project_key&order=project_key.asc&limit=5")"
          body="$(cat /tmp/control-plane.json)"
          if [ "$status" != "200" ]; then
            echo "Control Plane broker returned HTTP $status"
            BODY="$body" python -c 'import json,os; d=json.loads(os.environ["BODY"]); print(json.dumps({"error":d.get("error"),"detail":d.get("detail")}))'
            exit 1
          fi
          BODY="$body" python -c 'import json,os; rows=json.loads(os.environ["BODY"]); assert isinstance(rows,list), "Control Plane response is not a list"; keys={str(r.get("project_key") or "") for r in rows}; assert "ai-product-factory" in keys, "Expected Factory project is not readable through OIDC broker"; print(json.dumps({"status":"ok","projects":sorted(keys)}))'

  vercel-quota:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      FACTORY_VERCEL_TEAM_ID: ${{ vars.FACTORY_VERCEL_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Record rolling 24 hour Vercel deployment usage
        run: python scripts/collect_vercel_usage.py
