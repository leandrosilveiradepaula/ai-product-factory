name: CRM cross-repo credential preflight

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional exact CRM main SHA expected by the Factory snapshot
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/crm-cross-repo-preflight.yml"
      - "src/ai_product_factory/github_app_runtime.py"
      - "src/ai_product_factory/github_auth.py"
      - "src/ai_product_factory/existing_project_github_inventory.py"
      - ".github/crm-existing-inventory-target.json"
      - "supabase/functions/factory-runtime-control-plane/index.ts"

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
      GITHUB_ACTIONS: "true"
      GITHUB_REPOSITORY: leandrosilveiradepaula/ai-product-factory
      CRM_REPOSITORY: leandrosilveiradepaula/crm-infodive
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify CRM through ephemeral GitHub App token
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from urllib import request
          from ai_product_factory.github_auth import resolve_github_token

          repository=os.environ["CRM_REPOSITORY"]
          token=resolve_github_token(repository)
          headers={
              "Authorization": "Bearer "+token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2026-03-10",
          }
          def get(path):
              req=request.Request("https://api.github.com"+path,headers=headers)
              with request.urlopen(req,timeout=30) as response:
                  return json.loads(response.read().decode())

          repo=get("/repos/"+repository)
          ref=get("/repos/"+repository+"/git/ref/heads/main")
          if repo.get("full_name") != repository:
              raise SystemExit("repository identity mismatch")
          if repo.get("default_branch") != "main":
              raise SystemExit("CRM default branch is expected to be main")
          sha=str((ref.get("object") or {}).get("sha") or "")
          if len(sha) != 40:
              raise SystemExit("CRM main SHA missing")
          expected=os.environ.get("EXPECTED_SHA","").strip()
          if expected and sha != expected:
              raise SystemExit(f"CRM main SHA mismatch: expected {expected}, observed {sha}")
          print(json.dumps({
              "status":"ok",
              "repository":repository,
              "visibility":"private" if repo.get("private") else "public",
              "default_branch":"main",
              "head_sha":sha,
              "auth":"github_app_ephemeral",
              "credential_path":"github_app_only",
              "token_persisted":False,
          }))
          # The GitHub App token and broker already belong to THIS trusted
          # workflow's explicit OIDC allowlist. Do not mint a second token or
          # introduce another privileged workflow with a wider trust boundary.
          from pathlib import Path
          from ai_product_factory.existing_project_github_inventory import inventory_candidate, _get
          target=json.loads(Path(".github/crm-existing-inventory-target.json").read_text(encoding="utf-8"))
          if not isinstance(target,dict) or set(target)!={"repository","candidate_sha","pr_number"}:
              raise SystemExit("inventory target metadata is not strictly pinned")
          if target["repository"] != repository:
              raise SystemExit("inventory repository differs from credential preflight")
          evidence=inventory_candidate(
              repository=repository,
              candidate_sha=target["candidate_sha"],
              pr_number=target["pr_number"],
              get_json=lambda path: _get(token,path),
          )
          if (evidence["status"]!="not_assessed" or
              evidence["verification_state"]!="inventory_only" or
              evidence["coverage"]!=["repository_inventory"] or
              not evidence["blockers"] or evidence["evidence"] or
              evidence["production_schema_verified"] or
              evidence["authenticated_journeys_verified"]):
              raise SystemExit("Git inventory cannot be promoted to product readiness")
          output=Path("audit-evidence/crm-existing-inventory.json")
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps({"inventory_state":"not_assessed",
                            "candidate_commit":evidence["assessed_commit"],
                            "tracked_files":evidence["inventory"]["tracked_files"],
                            "existing_project_baseline_passed":False}))
          PY
      - name: Upload read-only inventory
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: crm-existing-tree-inventory
          path: audit-evidence/crm-existing-inventory.json
          retention-days: 7
          if-no-files-found: error
