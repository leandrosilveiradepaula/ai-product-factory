name: CRM cross-repo credential preflight

# Fresh-run marker: evaluate current openai-api environment secrets on every main change.

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional exact CRM main SHA expected by the Factory snapshot
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/crm-cross-repo-preflight.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: openai-api
    timeout-minutes: 5
    env:
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
      CRM_REPOSITORY: leandrosilveiradepaula/crm-infodive
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Require explicit cross-repo credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FACTORY_GITHUB_TOKEN:-}" ]; then
            echo '{"status":"blocked_missing_token","secret":"FACTORY_GITHUB_TOKEN"}'
            exit 2
          fi
          echo "::add-mask::$FACTORY_GITHUB_TOKEN"

      - name: Verify private CRM repository read access
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $FACTORY_GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          repo_json="$(curl --fail-with-body --silent --show-error "${auth[@]}" "https://api.github.com/repos/$CRM_REPOSITORY")"
          ref_json="$(curl --fail-with-body --silent --show-error "${auth[@]}" "https://api.github.com/repos/$CRM_REPOSITORY/git/ref/heads/main")"
          REPO_JSON="$repo_json" REF_JSON="$ref_json" python - <<'PY'
          import json, os
          repo=json.loads(os.environ["REPO_JSON"])
          ref=json.loads(os.environ["REF_JSON"])
          expected_repo=os.environ["CRM_REPOSITORY"]
          if repo.get("full_name") != expected_repo:
              raise SystemExit("repository identity mismatch")
          if repo.get("private") is not True:
              raise SystemExit("CRM repository is expected to remain private")
          if repo.get("default_branch") != "main":
              raise SystemExit("CRM default branch is expected to be main")
          sha=str((ref.get("object") or {}).get("sha") or "")
          if len(sha) != 40:
              raise SystemExit("CRM main SHA missing")
          expected=os.environ.get("EXPECTED_SHA","").strip()
          if expected and sha != expected:
              raise SystemExit(f"CRM main SHA mismatch: expected {expected}, observed {sha}")
          print(json.dumps({
              "status":"ok",
              "repository":expected_repo,
              "private":True,
              "default_branch":"main",
              "head_sha":sha,
              "access":"read_only_preflight"
          }))
          PY
