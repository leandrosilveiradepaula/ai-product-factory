name: CRM existing-project tree inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/crm-existing-inventory-target.json"
      - ".github/workflows/crm-existing-inventory.yml"
      - "src/ai_product_factory/existing_project_github_inventory.py"

permissions:
  contents: read
  id-token: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: src
      GITHUB_ACTIONS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/control-plane-oidc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Capture exact CRM candidate via GitHub App
        run: |
          set -euo pipefail
          python -m ai_product_factory.existing_project_github_inventory \
            --target .github/crm-existing-inventory-target.json \
            --output audit-evidence/crm-existing-inventory.json
      - name: Verify non-passing evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("audit-evidence/crm-existing-inventory.json").read_text())
          assert report["status"]=="not_assessed"
          assert report["verification_state"]=="inventory_only"
          assert report["coverage"]==["repository_inventory"]
          assert report["remote_identity_verified"] is True
          assert report["evidence"]==[] and report["blockers"]
          assert report["production_schema_verified"] is False
          assert report["authenticated_journeys_verified"] is False
          print("CRM Git inventory captured, not product-ready")
          PY
      - name: Upload read-only inventory
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: crm-existing-tree-inventory
          path: audit-evidence/crm-existing-inventory.json
          retention-days: 7
          if-no-files-found: error
