name: CRM209 exhausted native CI recovery PostgreSQL QA

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/*v2_crm209_exhausted_native_ci_recovery.sql"
      - "supabase/migrations/*crm209_native_deterministic_worker_claim.sql"
      - "src/ai_product_factory/crm209_native_ci_worker.py"
      - "scripts/run_crm209_native_ci_recovery.py"
      - "tests/test_crm209_native_ci_worker.py"
      - "scripts/verify_crm209_exhausted_native_ci_postgres.py"
      - "src/ai_product_factory/change_set_store.py"
      - "src/ai_product_factory/change_set_worker.py"
      - "src/ai_product_factory/ci_repair_candidate_evidence.py"
      - "src/ai_product_factory/ci_native_vitest_alias_repair.py"
      - "src/ai_product_factory/work_unit_context.py"
      - "tests/test_ci_native_vitest_alias_repair.py"
      - "tests/test_ci_repair_candidate_evidence.py"
      - ".github/workflows/crm209-exhausted-native-ci-postgres.yml"

permissions:
  contents: read

jobs:
  crm209-exhausted-native-ci-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: factory_crm209_native_qa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_crm209_native_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Verify bounded one-shot CI recovery only in isolated PostgreSQL
        env:
          FACTORY_CRM209_NATIVE_QA_ISOLATED: "true"
          FACTORY_CRM209_NATIVE_QA_DSN: "postgresql://factory_ci:disposable-only@127.0.0.1:5432/factory_crm209_native_qa"
        run: python scripts/verify_crm209_exhausted_native_ci_postgres.py
