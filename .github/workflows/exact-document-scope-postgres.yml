name: Exact audit document scope PostgreSQL QA
on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/*retry_verified_document_scope_preflight.sql"
      - "scripts/verify_exact_document_scope_preflight_postgres.py"
      - ".github/workflows/exact-document-scope-postgres.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/*retry_verified_document_scope_preflight.sql"
      - "scripts/verify_exact_document_scope_preflight_postgres.py"
      - ".github/workflows/exact-document-scope-postgres.yml"
permissions:
  contents: read
concurrency:
  group: exact-document-scope-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: factory_ci
          POSTGRES_DB: factory_document_scope_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_document_scope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install pinned PostgreSQL client
        run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Exercise typed document recovery and negative cases
        env:
          FACTORY_DOCUMENT_SCOPE_PG_TEST_ISOLATED: "true"
          FACTORY_DOCUMENT_SCOPE_PG_TEST_DSN: "postgresql://factory_ci:factory_ci@127.0.0.1:5432/factory_document_scope_test"
        run: python scripts/verify_exact_document_scope_preflight_postgres.py
