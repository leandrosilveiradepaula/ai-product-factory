name: Exact Preview browser evidence
run-name: Exact Preview browser evidence · ${{ inputs.candidate_sha || github.sha }}

on:
  push:
    branches:
      - "preview/**"
      - "evidence/preview/**"
    paths:
      - "apps/console/**"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate SHA whose existing Vercel Preview must be verified
        required: true
        type: string

permissions:
  contents: read
  checks: read
  statuses: write
  actions: write

concurrency:
  group: exact-preview-browser-${{ inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

jobs:
  browser-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.deleted == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve exact Vercel Preview from GitHub checks
        id: preview
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        with:
          script: |
            const sha = context.eventName === "workflow_dispatch"
              ? String(process.env.INPUT_CANDIDATE_SHA || "")
              : String(context.sha || "");
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed("candidate SHA must be an exact 40-character lowercase SHA");
              return;
            }
            const hostPattern = /([A-Za-z0-9][A-Za-z0-9-]*\.vercel\.app)/;
            for (let attempt = 0; attempt < 40; attempt++) {
              const [{data}, {data: combined}] = await Promise.all([
                github.rest.checks.listForRef({
                  ...context.repo,
                  ref: sha,
                  per_page: 100,
                }),
                github.rest.repos.getCombinedStatusForRef({
                  ...context.repo,
                  ref: sha,
                  per_page: 100,
                }),
              ]);
              const vercelStatuses = (combined.statuses || []).filter(s =>
                String(s.context || "").toLowerCase().includes("vercel")
              );
              const failedStatus = vercelStatuses.find(s =>
                ["failure","error"].includes(String(s.state || "").toLowerCase())
              );
              if (failedStatus) {
                core.setOutput("candidate_sha", sha);
                core.setFailed("Vercel commit status failed for exact candidate " + sha);
                return;
              }
              const readyStatus = vercelStatuses.some(s =>
                String(s.state || "").toLowerCase() === "success"
              );
              if (!readyStatus) {
                await new Promise(resolve => setTimeout(resolve, 5000));
                continue;
              }
              const vercel = data.check_runs.filter(c =>
                String(c.app?.slug || "").toLowerCase() === "vercel"
              );
              for (const check of vercel) {
                if (check.status !== "completed") continue;
                const haystack = [
                  check.output?.title,
                  check.output?.summary,
                  check.output?.text,
                  check.details_url,
                ].filter(Boolean).join("\n");
                const match = haystack.match(hostPattern);
                if (["success","neutral"].includes(String(check.conclusion)) && match) {
                  core.setOutput("url", "https://" + match[1]);
                  core.setOutput("candidate_sha", sha);
                  core.notice("Exact READY Preview resolved for " + sha + ": " + match[1]);
                  return;
                }
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setOutput("candidate_sha", sha);
            core.setFailed("Vercel Preview did not reach READY with a discoverable URL for exact candidate " + sha);

      - name: Dispatch trusted main browser verifier and wait
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          CANDIDATE_SHA: ${{ steps.preview.outputs.candidate_sha }}
        with:
          script: |
            const workflowId = "console-browser-evidence.yml";
            const started = Date.now();
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: workflowId,
              ref: "main",
              inputs: {
                preview_url: process.env.PREVIEW_URL,
                expected_text: "Entrar na Factory",
              },
            });
            core.notice("Dispatched trusted main browser verifier for candidate " + process.env.CANDIDATE_SHA);
            let selected = null;
            for (let attempt = 0; attempt < 90; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const {data} = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: workflowId,
                event: "workflow_dispatch",
                branch: "main",
                per_page: 20,
              });
              selected = data.workflow_runs.find(run =>
                Date.parse(run.created_at) >= started - 5000 &&
                run.event === "workflow_dispatch" &&
                run.head_branch === "main"
              ) || null;
              if (!selected) continue;
              if (selected.status !== "completed") continue;
              core.notice("Trusted browser verifier run: " + selected.html_url);
              if (selected.conclusion !== "success") {
                core.setFailed("Trusted browser verifier failed: " + selected.html_url);
              }
              return;
            }
            core.setFailed("Timed out waiting for trusted main browser verifier");

      - name: Record exact browser evidence status
        if: ${{ always() && steps.preview.outputs.candidate_sha != '' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CANDIDATE_SHA: ${{ steps.preview.outputs.candidate_sha }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === "success";
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.CANDIDATE_SHA,
              state: success ? "success" : "failure",
              context: "Factory Preview browser evidence",
              description: success
                ? "Exact Vercel Preview verified in trusted browser"
                : "Exact Vercel Preview browser verification failed",
            });
