name: Generate Console lockfile

on:
  push:
    branches:
      - "ci/generate-console-lockfile"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/console/package.json
      - name: Generate reproducible lockfile
        working-directory: apps/console
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm run typecheck
          npm run build
      - name: Commit generated lockfile to technical branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/console/package-lock.json
          if git diff --cached --quiet; then
            echo "lockfile already committed"
          else
            git commit -m "chore(console): add reproducible package lock"
            git push origin HEAD:ci/generate-console-lockfile
          fi
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: console-package-lock
          path: apps/console/package-lock.json
          retention-days: 1
          if-no-files-found: error
