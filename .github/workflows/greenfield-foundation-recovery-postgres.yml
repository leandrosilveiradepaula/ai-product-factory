name: Greenfield foundation recovery PostgreSQL QA

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261113173000_greenfield_first_wave_context_recovery.sql"
      - "scripts/verify_greenfield_foundation_context_recovery_postgres.py"
      - ".github/workflows/greenfield-foundation-recovery-postgres.yml"

permissions:
  contents: read

jobs:
  greenfield-foundation-recovery-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: factory_greenfield_recovery_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_greenfield_recovery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Verify bounded recovery and deny negative cases in disposable PostgreSQL
        env:
          FACTORY_GREENFIELD_RECOVERY_TEST_ISOLATED: "true"
          FACTORY_GREENFIELD_RECOVERY_TEST_DSN: "postgresql://factory_ci:disposable-only@127.0.0.1:5432/factory_greenfield_recovery_test"
        run: python scripts/verify_greenfield_foundation_context_recovery_postgres.py
