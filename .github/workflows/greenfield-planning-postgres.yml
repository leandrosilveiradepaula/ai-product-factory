name: Greenfield decision continuation PostgreSQL
on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/*greenfield_planning_decision*.sql"
      - "supabase/migrations/*preserve_runtime_stage_evidence.sql"
      - "scripts/verify_greenfield_planning_decision_postgres.py"
      - "scripts/verify_runtime_stage_evidence_postgres.py"
      - "scripts/verify_greenfield_direct_matrix_postgres.py"
      - ".github/workflows/greenfield-planning-postgres.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/*greenfield_planning_decision*.sql"
      - "supabase/migrations/*preserve_runtime_stage_evidence.sql"
      - "scripts/verify_greenfield_planning_decision_postgres.py"
      - "scripts/verify_runtime_stage_evidence_postgres.py"
      - "scripts/verify_greenfield_direct_matrix_postgres.py"
      - ".github/workflows/greenfield-planning-postgres.yml"
permissions:
  contents: read
concurrency:
  group: greenfield-pg-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  greenfield-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: factory_ci
          POSTGRES_DB: factory_greenfield_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_greenfield_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned local PostgreSQL test client
        run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Test decision resume and durable backfill on disposable PostgreSQL
        env:
          FACTORY_GREENFIELD_PG_TEST_ISOLATED: "true"
          FACTORY_GREENFIELD_PG_TEST_DSN: "postgresql://factory_ci:factory_ci@127.0.0.1:5432/factory_greenfield_test"
        run: python scripts/verify_greenfield_planning_decision_postgres.py
      - name: Verify stage receipts in disposable PostgreSQL
        env:
          FACTORY_GREENFIELD_PG_TEST_ISOLATED: "true"
          FACTORY_GREENFIELD_PG_TEST_DSN: "postgresql://factory_ci:factory_ci@127.0.0.1:5432/factory_greenfield_test"
        run: python scripts/verify_runtime_stage_evidence_postgres.py
      - name: Verify greenfield Direct matrix boundary in disposable PostgreSQL
        env:
          FACTORY_GREENFIELD_PG_TEST_ISOLATED: "true"
          FACTORY_GREENFIELD_PG_TEST_DSN: "postgresql://factory_ci:factory_ci@127.0.0.1:5432/factory_greenfield_test"
        run: python scripts/verify_greenfield_direct_matrix_postgres.py
