name: Journey Delivery Binding PostgreSQL QA
on:
  pull_request:
    paths:
      - "supabase/migrations/20261030150000_journey_delivery_binding_v2.sql"
      - "supabase/migrations/20261031120000_native_journey_v2_recovery.sql"
      - "supabase/migrations/20261031130000_v2_preflight_requeue_same_run.sql"
      - "supabase/migrations/20261031140000_v2_checkpoint_failure_requeue_once.sql"
      - "supabase/migrations/20261031141500_v2_recovery_retry_event_integrity.sql"
      - "scripts/verify_journey_delivery_binding_postgres.py"
      - "scripts/verify_journey_v2_native_recovery_postgres.py"
      - "scripts/fixtures/greenfield_v2_recovery_candidate.sql"
  workflow_dispatch:
permissions: { contents: read }
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: journey_binding_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d journey_binding_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: { python-version: "3.12" }
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - run: python scripts/verify_journey_delivery_binding_postgres.py
        env:
          FACTORY_JOURNEY_BINDING_TEST_DSN: postgresql://postgres:postgres@localhost:5432/journey_binding_test
      - run: python scripts/verify_journey_v2_native_recovery_postgres.py
        env:
          FACTORY_JOURNEY_RECOVERY_TEST_DSN: postgresql://postgres:postgres@localhost:5432/journey_binding_test

      # Draft-only scaffold: the local environment lacks the Supabase CLI.
      # Generate the actual migration with the official pinned binary in
      # isolated CI, then commit the resulting file and remove this step.
      - name: Generate versioned migration candidate in isolated workspace
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          curl -fsSL --retry 2 https://github.com/supabase/cli/releases/download/v2.98.1/supabase_linux_amd64.tar.gz -o "$work/cli.tar.gz"
          echo "78ee2574205bbca1530d01749b0df3c1cd37c8ca35d047887584d4620542a729  $work/cli.tar.gz" | sha256sum -c -
          tar -xzf "$work/cli.tar.gz" -C "$work" supabase
          mkdir -p "$work/project/supabase/migrations" "$RUNNER_TEMP/greenfield-migration"
          cd "$work/project"
          "$work/supabase" migration new --help
          "$work/supabase" migration new journey_v2_greenfield_planning_recovery
          mapfile -t files < <(find supabase/migrations -maxdepth 1 -name '*_journey_v2_greenfield_planning_recovery.sql')
          test "${#files[@]}" = 1
          cp "$GITHUB_WORKSPACE/scripts/fixtures/greenfield_v2_recovery_candidate.sql" "$RUNNER_TEMP/greenfield-migration/$(basename "${files[0]}")"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'pull_request'
        with:
          name: greenfield-recovery-versioned-migration
          path: ${{ runner.temp }}/greenfield-migration/*.sql
          if-no-files-found: error
          retention-days: 7
