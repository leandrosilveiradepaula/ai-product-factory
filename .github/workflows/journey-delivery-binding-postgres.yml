name: Journey Delivery Binding PostgreSQL QA
on:
  pull_request:
    paths:
      - "supabase/migrations/20261030150000_journey_delivery_binding_v2.sql"
      - "supabase/migrations/20261031120000_native_journey_v2_recovery.sql"
      - "scripts/verify_journey_delivery_binding_postgres.py"
      - "scripts/verify_journey_v2_native_recovery_postgres.py"
  workflow_dispatch:
permissions: { contents: read }
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: journey_binding_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d journey_binding_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: { python-version: "3.12" }
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - run: python scripts/verify_journey_delivery_binding_postgres.py
        env:
          FACTORY_JOURNEY_BINDING_TEST_DSN: postgresql://postgres:postgres@localhost:5432/journey_binding_test
      - run: python scripts/verify_journey_v2_native_recovery_postgres.py
        env:
          FACTORY_JOURNEY_RECOVERY_TEST_DSN: postgresql://postgres:postgres@localhost:5432/journey_binding_test
