name: Journey V2 Safe Supersession PostgreSQL QA
on:
  pull_request:
    paths:
      - "supabase/migrations/20261101130000_journey_v2_safe_supersession.sql"
      - "scripts/verify_journey_v2_safe_supersession_postgres.py"
      - "src/ai_product_factory/journey_delivery_binding.py"
      - "tests/test_journey_delivery_binding.py"
      - ".github/workflows/journey-v2-safe-supersession-postgres.yml"
  workflow_dispatch:
permissions: { contents: read }
jobs:
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: journey_supersession_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d journey_supersession_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.12" }
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Disposable PostgreSQL adversarial migration QA
        env:
          FACTORY_JOURNEY_SUPERSESSION_TEST_DSN: postgresql://postgres:postgres@localhost:5432/journey_supersession_test
        run: python scripts/verify_journey_v2_safe_supersession_postgres.py
