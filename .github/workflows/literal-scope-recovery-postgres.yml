name: Literal scope recovery PostgreSQL QA

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/*resume_blocked_literal_scope_misresolution.sql"
      - "scripts/verify_blocked_literal_scope_postgres.py"
      - "scripts/resume_blocked_literal_scopes.py"
      - "src/ai_product_factory/literal_scope_recovery.py"
      - "tests/test_literal_scope_recovery.py"
      - ".github/workflows/literal-scope-recovery-postgres.yml"

permissions:
  contents: read

jobs:
  literal-scope-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: factory_literal_scope_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_literal_scope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Verify SHA-and-epoch fenced recovery on isolated PostgreSQL
        env:
          FACTORY_LITERAL_SCOPE_TEST_ISOLATED: "true"
          FACTORY_LITERAL_SCOPE_TEST_DSN: "postgresql://factory_ci:disposable-only@127.0.0.1:5432/factory_literal_scope_test"
        run: python scripts/verify_blocked_literal_scope_postgres.py
