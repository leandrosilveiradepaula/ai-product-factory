name: Manual project lifecycle PostgreSQL QA
on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/*manual_project_execution_controls.sql"
      - "supabase/migrations/*fence_scheduler_eligibility_manual_control.sql"
      - "supabase/migrations/*fence_recovery_manual_project_control.sql"
      - "supabase/migrations/*fence_terminal_descendant_recovery_manual_control.sql"
      - "supabase/migrations/*quarantine_cross_epoch_recovery_replay.sql"
      - "tests/test_cross_epoch_recovery_fence.py"
      - "tests/test_terminal_descendant_operator_fence.py"
      - "scripts/verify_recovery_manual_project_control_postgres.py"
      - "tests/test_recovery_operator_control_contract.py"
      - "scripts/verify_scheduler_control_eligibility_postgres.py"
      - "supabase/migrations/*project_control_wake_outbox.sql"
      - "supabase/migrations/*repin_nonproduction_target.sql"
      - "supabase/migrations/*guard_stale_change_set_integration.sql"
      - "scripts/verify_stale_change_set_integration_postgres.py"
      - "supabase/migrations/*retry_blocked_platform_kind.sql"
      - "scripts/verify_platform_kind_recovery_postgres.py"
      - "scripts/verify_retire_obsolete_artifacts_postgres.py"
      - "supabase/migrations/*retire_obsolete_factory_artifacts.sql"
      - "scripts/verify_nonproduction_candidate_repin_postgres.py"
      - "scripts/verify_project_control_wake_postgres.py"
      - "src/ai_product_factory/project_control_wake_outbox.py"
      - "apps/console/lib/project-control-wake-outbox.ts"
      - "supabase/migrations/*graceful_stop_preserve_queue.sql"
      - "supabase/migrations/*fence_change_set_integration_epoch.sql"
      - "supabase/migrations/*atomic_change_set_integration_epoch_writes.sql"
      - "tests/test_atomic_integration_epoch_migration.py"
      - "src/ai_product_factory/change_set_integrator.py"
      - "src/ai_product_factory/change_set_store.py"
      - "tests/test_integration_epoch_migration.py"
      - "scripts/verify_manual_project_control_postgres.py"
      - "src/ai_product_factory/project_control_settlement.py"
      - "src/ai_product_factory/project_execution_control.py"
      - "supabase/migrations/*observe_preview_branch_integration.sql"
      - "scripts/verify_nonproduction_preview_merge_postgres.py"
      - "tests/test_nonproduction_preview_merge_migration.py"
      - "src/ai_product_factory/nonproduction_preview_merge.py"
      - "src/ai_product_factory/runtime_cli.py"
      - ".github/workflows/autonomous-runner.yml"
      - ".github/workflows/manual-project-control-postgres.yml"
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: factory_ci
          POSTGRES_DB: factory_project_control_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_project_control_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Verify transactional manual control without production infrastructure
        env:
          FACTORY_CONTROL_TEST_ISOLATED: "true"
          FACTORY_CONTROL_TEST_DSN: "postgresql://factory_ci:factory_ci@127.0.0.1:5432/factory_project_control_test"
        run: python scripts/verify_manual_project_control_postgres.py

  preview-integration-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: factory_ci
          POSTGRES_DB: factory_preview_observer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_preview_observer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Execute exact migration and fail-closed Preview integration regressions
        env:
          FACTORY_PREVIEW_OBSERVER_TEST_ISOLATED: "true"
          FACTORY_PREVIEW_OBSERVER_TEST_DSN: "postgresql://factory_ci:factory_ci@127.0.0.1:5432/factory_preview_observer_test"
        run: python scripts/verify_nonproduction_preview_merge_postgres.py

  project-wake-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: factory_ci
          POSTGRES_DB: factory_wake_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_wake_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Execute committed wake outbox in isolated PostgreSQL
        env:
          FACTORY_WAKE_TEST_ISOLATED: "true"
          FACTORY_WAKE_TEST_DSN: "postgresql://factory_ci:factory_ci@127.0.0.1:5432/factory_wake_test"
        run: python scripts/verify_project_control_wake_postgres.py

  candidate-repin-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: factory_ci
          POSTGRES_DB: factory_repin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_repin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Verify candidate CAS rejects stale, missing, active and forged evidence
        env:
          FACTORY_REPIN_TEST_ISOLATED: "true"
          FACTORY_REPIN_TEST_DSN: "postgresql://factory_ci:factory_ci@127.0.0.1:5432/factory_repin_test"
        run: python scripts/verify_nonproduction_candidate_repin_postgres.py

  change-set-guard-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: factory_ci
          POSTGRES_DB: factory_change_set_guard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_change_set_guard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Verify runnable, stale and paused Change Set guards in isolated PostgreSQL
        env:
          FACTORY_STALE_CHANGE_SET_TEST_ISOLATED: "true"
          FACTORY_STALE_CHANGE_SET_TEST_DSN: "postgresql://factory_ci:factory_ci@127.0.0.1:5432/factory_change_set_guard_test"
        run: python scripts/verify_stale_change_set_integration_postgres.py

  retire-obsolete-artifacts-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: factory_ci
          POSTGRES_DB: factory_retire_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_retire_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Assert verified-only retirement and audit in isolated PostgreSQL
        env:
          FACTORY_RETIRE_TEST_ISOLATED: "true"
          FACTORY_RETIRE_TEST_DSN: "postgresql://factory_ci:factory_ci@127.0.0.1:5432/factory_retire_test"
        run: python scripts/verify_retire_obsolete_artifacts_postgres.py


  platform-kind-recovery-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: factory_ci
          POSTGRES_DB: factory_platform_recovery_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_platform_recovery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Execute guarded platform-kind recovery in disposable PostgreSQL
        env:
          FACTORY_PLATFORM_RECOVERY_TEST_ISOLATED: "true"
          FACTORY_PLATFORM_RECOVERY_TEST_DSN: "postgresql://factory_ci:factory_ci@127.0.0.1:5432/factory_platform_recovery_test"
        run: python scripts/verify_platform_kind_recovery_postgres.py

  scheduler-control-eligibility-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: factory_ci
          POSTGRES_DB: factory_scheduler_eligibility_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_scheduler_eligibility_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Execute actual SQL with draft, running, paused, stopped and dedupe
        env:
          FACTORY_SCHEDULER_ELIGIBILITY_TEST_ISOLATED: "true"
          FACTORY_SCHEDULER_ELIGIBILITY_TEST_DSN: "postgresql://factory_ci:factory_ci@127.0.0.1:5432/factory_scheduler_eligibility_test"
        run: python scripts/verify_scheduler_control_eligibility_postgres.py

  recovery-operator-control-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: factory_ci
          POSTGRES_DB: factory_recovery_control_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_recovery_control_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Exercise paused/running leases, Change Sets, specialist and decision recovery
        env:
          FACTORY_RECOVERY_CONTROL_TEST_ISOLATED: "true"
          FACTORY_RECOVERY_CONTROL_TEST_DSN: "postgresql://factory_ci:factory_ci@127.0.0.1:5432/factory_recovery_control_test"
        run: python scripts/verify_recovery_manual_project_control_postgres.py
