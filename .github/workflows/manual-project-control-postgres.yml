name: Manual project lifecycle PostgreSQL QA
on:
  pull_request:
    branches: [main]
    # The readiness certifier hashes every non-Markdown blob in the Git tree.
    # Any executable/source/config change must therefore produce fresh,
    # same-tree isolated PostgreSQL evidence before a human merge.
    paths:
      - "**"
      - "!**/*.md"
      - "!**/*.MD"
      - "!*.md"
      - "!*.MD"
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: factory_ci
          POSTGRES_DB: factory_project_control_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_project_control_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Verify transactional manual control without production infrastructure
        env:
          FACTORY_CONTROL_TEST_ISOLATED: "true"
          FACTORY_CONTROL_TEST_DSN: "postgresql://factory_ci:factory_ci@127.0.0.1:5432/factory_project_control_test"
        run: python scripts/verify_manual_project_control_postgres.py
      - name: Verify Console Auth/RLS migrations with real denied role claims
        env:
          FACTORY_CONTROL_TEST_ISOLATED: "true"
          FACTORY_CONTROL_TEST_DSN: "postgresql://factory_ci:factory_ci@127.0.0.1:5432/factory_project_control_test"
        run: python scripts/verify_block1_console_auth_rls_postgres.py

