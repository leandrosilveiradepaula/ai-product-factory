name: Manual project lifecycle PostgreSQL QA
on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/*manual_project_execution_controls.sql"
      - "supabase/migrations/*graceful_stop_preserve_queue.sql"
      - "supabase/migrations/*fence_change_set_integration_epoch.sql"
      - "supabase/migrations/*atomic_change_set_integration_epoch_writes.sql"
      - "tests/test_atomic_integration_epoch_migration.py"
      - "src/ai_product_factory/change_set_integrator.py"
      - "src/ai_product_factory/change_set_store.py"
      - "tests/test_integration_epoch_migration.py"
      - "scripts/verify_manual_project_control_postgres.py"
      - "src/ai_product_factory/project_control_settlement.py"
      - "src/ai_product_factory/project_execution_control.py"
      - "src/ai_product_factory/runtime_cli.py"
      - ".github/workflows/autonomous-runner.yml"
      - ".github/workflows/manual-project-control-postgres.yml"
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: factory_ci
          POSTGRES_DB: factory_project_control_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_project_control_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Verify transactional manual control without production infrastructure
        env:
          FACTORY_CONTROL_TEST_ISOLATED: "true"
          FACTORY_CONTROL_TEST_DSN: "postgresql://factory_ci:factory_ci@127.0.0.1:5432/factory_project_control_test"
        run: python scripts/verify_manual_project_control_postgres.py
