name: Native V2 existing journey read-only audit

on:
  workflow_dispatch:
    inputs:
      project_key:
        description: Existing project key (e.g. crm-infodive)
        required: true
        type: string
      journey_id:
        description: Immutable native V2 journey UUID
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  native-v2-evidence:
    # No scheduler, paid lane, write permissions or production release.
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' &&
         github.actor == 'leandrosilveiradepaula' &&
         github.event.sender.id == 256917842) ||
        (github.event_name == 'issue_comment' &&
         github.event.action == 'created' &&
         github.event.issue.number == 713 &&
         !github.event.issue.pull_request &&
         github.event.comment.author_association == 'OWNER' &&
         github.event.comment.user.id == 256917842 &&
         github.event.sender.id == 256917842 &&
         github.actor == 'leandrosilveiradepaula' &&
         startsWith(github.event.comment.body, '/factory-v2-journey-audit '))
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: openai-api
    permissions:
      contents: read
      id-token: write
      actions: read
      pull-requests: read
      statuses: read
      checks: read
      issues: read
    env:
      PYTHONPATH: src
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Require exact OWNER / immutable Journey V2 command before OIDC
        run: python scripts/audit_native_v2_journey.py --event-path "$GITHUB_EVENT_PATH" --check-event
      - uses: ./.github/actions/control-plane-oidc
      - name: Verify source, CI, Preview and actual postmerge browser read-only
        env:
          FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
        run: >-
          python scripts/audit_native_v2_journey.py
          --event-path "$GITHUB_EVENT_PATH"
          --output "$RUNNER_TEMP/native-v2-journey-evidence.json"
      - name: Preserve redacted proof or fail-closed blocker
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-v2-readonly-${{ github.run_id }}
          path: ${{ runner.temp }}/native-v2-journey-evidence.json
          if-no-files-found: warn
          retention-days: 7
