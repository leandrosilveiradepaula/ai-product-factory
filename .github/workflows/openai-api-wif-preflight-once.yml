name: OpenAI API WIF preflight once
# diagnostic-rerun: 2026-09-29 final API-WIF recheck

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/openai-api-wif-preflight-once.yml"

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: openai-api
    env:
      OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
      OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
      OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Inspect GitHub OIDC claims safely
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          request_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          request_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          audience = os.environ["OPENAI_WIF_AUDIENCE"]

          parts = urllib.parse.urlsplit(request_url)
          query = dict(urllib.parse.parse_qsl(parts.query, keep_blank_values=True))
          query["audience"] = audience
          oidc_url = urllib.parse.urlunsplit(
              (parts.scheme, parts.netloc, parts.path, urllib.parse.urlencode(query), parts.fragment)
          )
          req = urllib.request.Request(
              oidc_url,
              headers={"Authorization": f"bearer {request_token}"},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              token = json.loads(response.read().decode("utf-8"))["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload.encode("ascii")).decode("utf-8"))
          allowed = (
              "iss", "aud", "sub", "repository", "repository_owner", "ref",
              "environment", "workflow", "workflow_ref", "job_workflow_ref",
              "event_name",
          )
          safe = {key: claims.get(key) for key in allowed if key in claims}
          print("github_oidc_claims=" + json.dumps(safe, sort_keys=True))
          PY
      - name: Exchange GitHub OIDC for short-lived OpenAI token
        run: python -m ai_product_factory.openai_wif_preflight
