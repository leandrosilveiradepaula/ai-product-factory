name: OpenAI API WIF preflight

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: openai-api
    env:
      OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
      OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
      OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
      FACTORY_WIF_EXPECTED_REPOSITORY: leandrosilveiradepaula/ai-product-factory
      FACTORY_WIF_EXPECTED_REF: refs/heads/main
      FACTORY_WIF_EXPECTED_ENVIRONMENT: openai-api
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Exchange GitHub OIDC for short-lived OpenAI token
        run: python -m ai_product_factory.openai_wif_preflight
