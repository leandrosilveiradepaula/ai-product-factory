name: OpenAI runtime execute

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Factory task id
        required: true
        default: manual-runtime-test
        type: string
      objective:
        description: Objective for the primary model
        required: true
        default: Return a concise confirmation that the AI Product Factory runtime is operational.
        type: string
      complexity:
        description: Task complexity
        required: true
        default: medium
        type: choice
        options:
          - low
          - medium
          - high
          - very_high
      reasoning_effort:
        description: Reasoning effort
        required: true
        default: medium
        type: choice
        options:
          - none
          - low
          - medium
          - high
          - xhigh
          - max

permissions:
  contents: read
  id-token: write

jobs:
  execute:
    runs-on: ubuntu-latest
    environment: openai-api
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
      OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
      OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate primary authentication
        shell: bash
        run: |
          if [ -n "$OPENAI_IDENTITY_PROVIDER_ID$OPENAI_SERVICE_ACCOUNT_ID$OPENAI_WIF_AUDIENCE" ]; then
            if [ -n "$OPENAI_IDENTITY_PROVIDER_ID" ] && [ -n "$OPENAI_SERVICE_ACCOUNT_ID" ] && [ -n "$OPENAI_WIF_AUDIENCE" ]; then
              echo "primary_auth=workload_identity"
            else
              echo "OpenAI API workload identity is partially configured; refusing API-key fallback."
              exit 2
            fi
          elif [ -n "$OPENAI_API_KEY" ]; then
            echo "primary_auth=api_key"
          else
            echo "Primary OpenAI auth is not configured."
            exit 2
          fi

      - name: Execute primary model
        shell: bash
        run: |
          python -m ai_product_factory.cli openai-execute \
            --task-id "${{ inputs.task_id }}" \
            --objective "${{ inputs.objective }}" \
            --complexity "${{ inputs.complexity }}" \
            --reasoning-effort "${{ inputs.reasoning_effort }}"
