name: OpenAI runtime smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
      OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
      OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate primary authentication
        shell: bash
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "primary_auth=api_key"
          elif [ -n "$OPENAI_IDENTITY_PROVIDER_ID" ] && [ -n "$OPENAI_SERVICE_ACCOUNT_ID" ] && [ -n "$OPENAI_WIF_AUDIENCE" ]; then
            echo "primary_auth=workload_identity"
          else
            echo "Primary OpenAI auth is not configured."
            exit 2
          fi

      - name: Execute smoke test
        shell: bash
        run: |
          python -m ai_product_factory.cli openai-execute \
            --task-id "smoke-openai-api" \
            --objective "Return exactly FACTORY_SMOKE_OK and nothing else." \
            --complexity "low" \
            --reasoning-effort "none"
