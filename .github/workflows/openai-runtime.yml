name: OpenAI runtime smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate secret presence
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured for this repository."
            exit 2
          fi

      - name: Execute smoke test
        shell: bash
        run: |
          python -m ai_product_factory.cli openai-execute \
            --task-id "smoke-openai-api" \
            --objective "Return exactly FACTORY_SMOKE_OK and nothing else." \
            --complexity "low" \
            --reasoning-effort "none"
