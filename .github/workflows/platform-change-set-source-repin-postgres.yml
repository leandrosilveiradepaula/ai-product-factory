name: Platform Change Set source repin PostgreSQL QA
on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/*platform_blocked_change_set_source_repin.sql"
      - "scripts/verify_platform_source_repin_postgres.py"
      - ".github/workflows/platform-change-set-source-repin-postgres.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/*platform_blocked_change_set_source_repin.sql"
      - "scripts/verify_platform_source_repin_postgres.py"
      - ".github/workflows/platform-change-set-source-repin-postgres.yml"
permissions:
  contents: read
concurrency:
  group: platform-source-repin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: factory_ci
          POSTGRES_DB: factory_platform_repin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_platform_repin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned PostgreSQL client
        run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Test bounded source ancestry, CAS and ACL
        env:
          FACTORY_PLATFORM_REPIN_PG_ISOLATED: "true"
          FACTORY_PLATFORM_REPIN_PG_DSN: "postgresql://factory_ci:factory_ci@127.0.0.1:5432/factory_platform_repin_test"
        run: python scripts/verify_platform_source_repin_postgres.py
