name: Project Supabase access preflight

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Expected Supabase project ref
        required: true
        type: string
      environment_name:
        description: GitHub Environment holding the project-scoped credential
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify read-only project access
        env:
          FACTORY_PROJECT_SUPABASE_ACCESS_TOKEN: ${{ secrets.FACTORY_PROJECT_SUPABASE_ACCESS_TOKEN }}
        run: |
          python scripts/verify_project_supabase.py --project-ref "${{ inputs.project_ref }}"
