name: Promote exact PR candidate to Vercel Preview

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose exact head is ready for Preview
        required: true
        type: string
      candidate_sha:
        description: Exact 40-character PR head SHA
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: read
  checks: read

concurrency:
  group: vercel-preview-candidate-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  promote-preview-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify exact PR candidate, green checks and reuse opportunity
        id: verify
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const sha = process.env.CANDIDATE_SHA;
            if (!Number.isInteger(prNumber) || prNumber < 1) return core.setFailed("invalid PR number");
            if (!/^[0-9a-f]{40}$/.test(sha)) return core.setFailed("candidate_sha must be an exact 40-character SHA");
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: prNumber});
            if (pr.state !== "open") return core.setFailed("PR must be open");
            if (pr.head.sha !== sha) return core.setFailed("candidate SHA is not the exact PR head");
            const {data: checks} = await github.rest.checks.listForRef({...context.repo, ref: sha, per_page: 100});
            for (const name of ["test", "factory-acceptance", "validate"]) {
              const ok = checks.check_runs.some(c => c.name === name && c.status === "completed" && c.conclusion === "success");
              if (!ok) return core.setFailed("required check is not green: " + name);
            }

            const ref = "heads/preview/pr-" + prNumber;
            try {
              const {data: current} = await github.rest.git.getRef({...context.repo, ref});
              if (current.object.sha === sha) {
                core.setOutput("needs_promotion", "false");
                core.setOutput("promotion_action", "reused");
                core.notice("Preview ref already points to this exact candidate; no new deployment was requested.");
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput("needs_promotion", "true");

      - name: Enforce bounded Preview deployment budget
        if: steps.verify.outputs.needs_promotion == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          FACTORY_VERCEL_TEAM_ID: ${{ vars.FACTORY_VERCEL_TEAM_ID }}
        run: python -m scripts.preview_budget_guard

      - name: Create or update one preview ref to the exact candidate
        if: steps.verify.outputs.needs_promotion == 'true'
        id: promote
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        with:
          script: |
            const ref = "heads/preview/pr-" + Number(process.env.PR_NUMBER);
            const sha = process.env.CANDIDATE_SHA;
            try {
              await github.rest.git.getRef({...context.repo, ref});
              await github.rest.git.updateRef({...context.repo, ref, sha, force: true});
              core.setOutput("promotion_action", "updated");
              core.notice("Updated refs/" + ref + " directly to exact candidate " + sha + ".");
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({...context.repo, ref: "refs/" + ref, sha});
              core.setOutput("promotion_action", "created");
              core.notice("Created refs/" + ref + " directly at exact candidate " + sha + ".");
            }

      - name: Record durable Preview promotion summary
        if: always() && !cancelled()
        env:
          VERIFY_ACTION: ${{ steps.verify.outputs.promotion_action }}
          PROMOTE_ACTION: ${{ steps.promote.outputs.promotion_action }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          action="${PROMOTE_ACTION:-${VERIFY_ACTION:-unknown}}"
          {
            printf '%s\n' "### Preview promotion"
            printf '%s\n' "- PR: #$PR_NUMBER"
            printf '%s\n' "- candidate: $CANDIDATE_SHA"
            printf '%s\n' "- action: $action"
            printf '%s\n' "- deploy path: GitHub ref -> Vercel Git integration"
          } >> "$GITHUB_STEP_SUMMARY"
