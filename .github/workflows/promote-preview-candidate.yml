name: Promote exact PR candidate to Vercel Preview

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose exact head is ready for Preview
        required: true
        type: string
      candidate_sha:
        description: Exact 40-character PR head SHA
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read
  checks: read

jobs:
  promote-preview-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact PR candidate and green required checks
        id: verify
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const sha = process.env.CANDIDATE_SHA;
            if (!Number.isInteger(prNumber) || prNumber < 1) return core.setFailed("invalid PR number");
            if (!/^[0-9a-f]{40}$/.test(sha)) return core.setFailed("candidate_sha must be an exact 40-character SHA");
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: prNumber});
            if (pr.state !== "open") return core.setFailed("PR must be open");
            if (pr.head.sha !== sha) return core.setFailed("candidate SHA is not the exact PR head");
            if (!/^[0-9a-f]{40}$/.test(String(pr.base.sha || ""))) return core.setFailed("PR base SHA is unavailable");
            core.setOutput("base_sha", pr.base.sha);
            const {data: checks} = await github.rest.checks.listForRef({...context.repo, ref: sha, per_page: 100});
            for (const name of ["test", "factory-acceptance", "validate"]) {
              const ok = checks.check_runs.some(c => c.name === name && c.status === "completed" && c.conclusion === "success");
              if (!ok) return core.setFailed("required check is not green: " + name);
            }
      - name: Point one preview ref at the exact candidate SHA
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ steps.verify.outputs.base_sha }}
        with:
          script: |
            const ref = "heads/preview/pr-" + Number(process.env.PR_NUMBER);
            const sha = process.env.CANDIDATE_SHA;
            const baseSha = process.env.BASE_SHA;
            if (!/^[0-9a-f]{40}$/.test(baseSha || "")) return core.setFailed("verified PR base SHA is missing");
            try {
              await github.rest.git.getRef({...context.repo, ref});
              await github.rest.git.deleteRef({...context.repo, ref});
              core.notice("Removed prior refs/" + ref + " so this promotion starts from the PR base again.");
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.git.createRef({...context.repo, ref: "refs/" + ref, sha: baseSha});
            core.notice("Seeded refs/" + ref + " at PR base " + baseSha + " so the next ref update carries the full PR diff to Git integrations.");
            await github.rest.git.updateRef({...context.repo, ref, sha, force: true});
            core.notice("Preview ref refs/" + ref + " now points to exact candidate " + sha);
