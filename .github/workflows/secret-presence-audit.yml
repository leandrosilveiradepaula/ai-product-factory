name: Secret presence audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/secret-presence-audit.yml"

permissions:
  contents: read

jobs:
  repo-scope:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      FACTORY_PROJECT_SUPABASE_ACCESS_TOKEN: ${{ secrets.FACTORY_PROJECT_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_OAUTH_CLIENT_ID: ${{ secrets.SUPABASE_OAUTH_CLIENT_ID }}
      SUPABASE_OAUTH_CLIENT_SECRET: ${{ secrets.SUPABASE_OAUTH_CLIENT_SECRET }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
      OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
      OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
      OPENAI_FEDERATION_RULE_ID: ${{ vars.OPENAI_FEDERATION_RULE_ID }}
      FACTORY_CODEX_ENABLED: ${{ vars.FACTORY_CODEX_ENABLED }}
      FACTORY_CODEX_MANUAL_FALLBACK_ENABLED: ${{ vars.FACTORY_CODEX_MANUAL_FALLBACK_ENABLED }}
      FACTORY_VERCEL_TEAM_ID: ${{ vars.FACTORY_VERCEL_TEAM_ID }}
      FACTORY_VERCEL_PROJECT_NAME: ${{ vars.FACTORY_VERCEL_PROJECT_NAME }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -u
          for name in OPENAI_API_KEY FACTORY_GITHUB_TOKEN VERCEL_TOKEN CODEX_ACCESS_TOKEN FACTORY_PROJECT_SUPABASE_ACCESS_TOKEN SUPABASE_SECRET_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_OAUTH_CLIENT_ID SUPABASE_OAUTH_CLIENT_SECRET SUPABASE_PUBLISHABLE_KEY OPENAI_IDENTITY_PROVIDER_ID OPENAI_SERVICE_ACCOUNT_ID OPENAI_WIF_AUDIENCE OPENAI_FEDERATION_RULE_ID FACTORY_CODEX_ENABLED FACTORY_CODEX_MANUAL_FALLBACK_ENABLED FACTORY_VERCEL_TEAM_ID FACTORY_VERCEL_PROJECT_NAME; do
            if [ -n "${!name:-}" ]; then echo "$name=present"; else echo "$name=absent"; fi
          done

  openai-api:
    runs-on: ubuntu-latest
    environment: openai-api
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      FACTORY_PROJECT_SUPABASE_ACCESS_TOKEN: ${{ secrets.FACTORY_PROJECT_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_OAUTH_CLIENT_ID: ${{ secrets.SUPABASE_OAUTH_CLIENT_ID }}
      SUPABASE_OAUTH_CLIENT_SECRET: ${{ secrets.SUPABASE_OAUTH_CLIENT_SECRET }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
      OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
      OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
      OPENAI_FEDERATION_RULE_ID: ${{ vars.OPENAI_FEDERATION_RULE_ID }}
      FACTORY_CODEX_ENABLED: ${{ vars.FACTORY_CODEX_ENABLED }}
      FACTORY_CODEX_MANUAL_FALLBACK_ENABLED: ${{ vars.FACTORY_CODEX_MANUAL_FALLBACK_ENABLED }}
      FACTORY_VERCEL_TEAM_ID: ${{ vars.FACTORY_VERCEL_TEAM_ID }}
      FACTORY_VERCEL_PROJECT_NAME: ${{ vars.FACTORY_VERCEL_PROJECT_NAME }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -u
          for name in OPENAI_API_KEY FACTORY_GITHUB_TOKEN VERCEL_TOKEN CODEX_ACCESS_TOKEN FACTORY_PROJECT_SUPABASE_ACCESS_TOKEN SUPABASE_SECRET_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_OAUTH_CLIENT_ID SUPABASE_OAUTH_CLIENT_SECRET SUPABASE_PUBLISHABLE_KEY OPENAI_IDENTITY_PROVIDER_ID OPENAI_SERVICE_ACCOUNT_ID OPENAI_WIF_AUDIENCE OPENAI_FEDERATION_RULE_ID FACTORY_CODEX_ENABLED FACTORY_CODEX_MANUAL_FALLBACK_ENABLED FACTORY_VERCEL_TEAM_ID FACTORY_VERCEL_PROJECT_NAME; do
            if [ -n "${!name:-}" ]; then echo "$name=present"; else echo "$name=absent"; fi
          done

  openai-codex:
    runs-on: ubuntu-latest
    environment: openai-codex
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      FACTORY_PROJECT_SUPABASE_ACCESS_TOKEN: ${{ secrets.FACTORY_PROJECT_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_OAUTH_CLIENT_ID: ${{ secrets.SUPABASE_OAUTH_CLIENT_ID }}
      SUPABASE_OAUTH_CLIENT_SECRET: ${{ secrets.SUPABASE_OAUTH_CLIENT_SECRET }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
      OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
      OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
      OPENAI_FEDERATION_RULE_ID: ${{ vars.OPENAI_FEDERATION_RULE_ID }}
      FACTORY_CODEX_ENABLED: ${{ vars.FACTORY_CODEX_ENABLED }}
      FACTORY_CODEX_MANUAL_FALLBACK_ENABLED: ${{ vars.FACTORY_CODEX_MANUAL_FALLBACK_ENABLED }}
      FACTORY_VERCEL_TEAM_ID: ${{ vars.FACTORY_VERCEL_TEAM_ID }}
      FACTORY_VERCEL_PROJECT_NAME: ${{ vars.FACTORY_VERCEL_PROJECT_NAME }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -u
          for name in OPENAI_API_KEY FACTORY_GITHUB_TOKEN VERCEL_TOKEN CODEX_ACCESS_TOKEN FACTORY_PROJECT_SUPABASE_ACCESS_TOKEN SUPABASE_SECRET_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_OAUTH_CLIENT_ID SUPABASE_OAUTH_CLIENT_SECRET SUPABASE_PUBLISHABLE_KEY OPENAI_IDENTITY_PROVIDER_ID OPENAI_SERVICE_ACCOUNT_ID OPENAI_WIF_AUDIENCE OPENAI_FEDERATION_RULE_ID FACTORY_CODEX_ENABLED FACTORY_CODEX_MANUAL_FALLBACK_ENABLED FACTORY_VERCEL_TEAM_ID FACTORY_VERCEL_PROJECT_NAME; do
            if [ -n "${!name:-}" ]; then echo "$name=present"; else echo "$name=absent"; fi
          done
