name: SQL-InfoDive private network preflight (no model)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-route-only:
    if: ${{ github.repository == 'leandrosilveiradepaula/ai-product-factory' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    environment: ibm-private-llm
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: src
      FACTORY_SQL_INFODIVE_ENABLED: "true"
      FACTORY_SQL_INFODIVE_BASE_URL: ${{ vars.FACTORY_SQL_INFODIVE_BASE_URL }}
      FACTORY_SQL_INFODIVE_MODEL: ${{ vars.FACTORY_SQL_INFODIVE_MODEL }}
      FACTORY_SQL_INFODIVE_HTTP_HOST: ${{ vars.FACTORY_SQL_INFODIVE_HTTP_HOST }}
      FACTORY_SQL_INFODIVE_ALLOW_PRIVATE_HTTP: "true"
      FACTORY_INFODIVE_WG_CLIENT_PRIVATE_KEY: ${{ secrets.FACTORY_INFODIVE_WG_CLIENT_PRIVATE_KEY }}
      FACTORY_INFODIVE_WG_PEER_PUBLIC_KEY: ${{ vars.FACTORY_INFODIVE_WG_PEER_PUBLIC_KEY }}
      FACTORY_INFODIVE_WG_ENDPOINT: ${{ vars.FACTORY_INFODIVE_WG_ENDPOINT }}
      FACTORY_INFODIVE_WG_CLIENT_ADDRESS: ${{ vars.FACTORY_INFODIVE_WG_CLIENT_ADDRESS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Prepare minimal private VPN (no model call)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python scripts/sql_infodive_private_network.py --prepare "$RUNNER_TEMP/factory-ibm.conf"
      - name: Install WireGuard tools (no provider credentials)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -yqq wireguard-tools
      - name: Establish approved ephemeral tunnel
        shell: bash
        run: |
          set -euo pipefail
          sudo wg-quick up "$RUNNER_TEMP/factory-ibm.conf"
      - name: Verify private route and TCP only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sql_infodive_private_network.py --probe "$RUNNER_TEMP/sql-infodive-private-network.json"
      - name: Tear down tunnel and delete ephemeral private key
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/factory-ibm.conf" ]; then
            sudo wg-quick down "$RUNNER_TEMP/factory-ibm.conf" >/dev/null 2>&1
            shred -u "$RUNNER_TEMP/factory-ibm.conf" >/dev/null 2>&1 || rm -f "$RUNNER_TEMP/factory-ibm.conf"
          fi
      - name: Retain sanitized network-only SHA-bound receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sql-infodive-network-${{ github.run_id }}
          path: ${{ runner.temp }}/sql-infodive-private-network.json
          retention-days: 7
          if-no-files-found: error
