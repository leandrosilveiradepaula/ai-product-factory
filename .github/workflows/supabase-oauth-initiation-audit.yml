name: Supabase OAuth initiation audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-oauth-initiation-audit.yml"

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: openai-api
    timeout-minutes: 10
    env:
      FACTORY_CONSOLE_URL: https://ai-product-factory-console.vercel.app
      FACTORY_VISUAL_BROKER_URL: https://fjplmxfcshhbmzgvyqlm.supabase.co/functions/v1/factory-visual-evidence-broker
      PROJECT_KEY: crm-infodive
      DATABASE_ID: 5086d662-42eb-43a6-a8da-0da59cb39d75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned Playwright browser
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Mint provisioning OIDC
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("factory-visual-evidence");
            core.setSecret(token);
            core.setOutput("token", token);
      - name: Provision ephemeral admin
        shell: bash
        env:
          FACTORY_GITHUB_OIDC: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          body="$(node -e 'process.stdout.write(JSON.stringify({action:"provision",workflowRunId:Number(process.env.GITHUB_RUN_ID),sourceCommit:process.env.GITHUB_SHA}))')"
          response="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $FACTORY_GITHUB_OIDC" -H "Content-Type: application/json" --data "$body" "$FACTORY_VISUAL_BROKER_URL")"
          RESPONSE="$response" node - <<'NODE'
          const data=JSON.parse(process.env.RESPONSE);
          for (const key of ["email","password","userId"]) if (!data[key]) throw new Error("missing "+key);
          for (const value of [data.email,data.password,data.userId]) console.log("::add-mask::"+value);
          const fs=require("fs");
          fs.appendFileSync(process.env.GITHUB_ENV,
            "FACTORY_VISUAL_EMAIL="+data.email+"\n"+
            "FACTORY_VISUAL_PASSWORD="+data.password+"\n"+
            "FACTORY_VISUAL_USER_ID="+data.userId+"\n");
          NODE
      - name: Verify OAuth initiation
        shell: bash
        run: |
          node - <<'NODE'
          const {chromium}=require("playwright");
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage();
              let r=await page.goto(process.env.FACTORY_CONSOLE_URL+"/login",{waitUntil:"networkidle",timeout:60000});
              if(!r||r.status()>=400)throw new Error("login page failed");
              await page.locator('input[name="email"]').fill(process.env.FACTORY_VISUAL_EMAIL);
              await page.locator('input[name="password"]').fill(process.env.FACTORY_VISUAL_PASSWORD);
              await Promise.all([
                page.waitForResponse(resp=>resp.request().method()==="POST"&&new URL(resp.url()).pathname==="/login",{timeout:60000}),
                page.getByRole("button",{name:"Entrar"}).click(),
              ]);
              const projectUrl=process.env.FACTORY_CONSOLE_URL+"/projects/"+encodeURIComponent(process.env.PROJECT_KEY);
              r=await page.goto(projectUrl,{waitUntil:"networkidle",timeout:60000});
              if(!r||r.status()>=400)throw new Error("project page failed");
              const link=page.getByRole("link",{name:"Conectar Supabase"});
              await link.waitFor({state:"visible",timeout:30000});
              const href=await link.getAttribute("href");
              if(!href||!href.includes(process.env.DATABASE_ID))throw new Error("connect href missing expected database binding");
              await page.goto(process.env.FACTORY_CONSOLE_URL+href,{waitUntil:"domcontentloaded",timeout:60000});
              const u=new URL(page.url());
              if(u.origin!=="https://api.supabase.com"||u.pathname!=="/v1/oauth/authorize")throw new Error("unexpected OAuth redirect");
              const required=["client_id","redirect_uri","response_type","state","code_challenge","code_challenge_method"];
              for(const name of required)if(!u.searchParams.get(name))throw new Error("missing OAuth parameter "+name);
              if(u.searchParams.get("response_type")!=="code")throw new Error("response_type mismatch");
              if(u.searchParams.get("code_challenge_method")!=="S256")throw new Error("PKCE method mismatch");
              if(u.searchParams.get("redirect_uri")!=="https://ai-product-factory-console.vercel.app/api/integrations/supabase/callback")throw new Error("callback mismatch");
              console.log(JSON.stringify({
                status:"ok",
                project:process.env.PROJECT_KEY,
                database:process.env.DATABASE_ID,
                redirect_origin:u.origin,
                redirect_path:u.pathname,
                response_type:u.searchParams.get("response_type"),
                pkce:u.searchParams.get("code_challenge_method"),
                callback:u.searchParams.get("redirect_uri"),
                state_present:Boolean(u.searchParams.get("state")),
                challenge_present:Boolean(u.searchParams.get("code_challenge"))
              }));
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Mint cleanup OIDC
        if: always()
        id: cleanup_oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("factory-visual-evidence");
            core.setSecret(token);
            core.setOutput("token", token);
      - name: Cleanup ephemeral admin
        if: always()
        shell: bash
        env:
          FACTORY_GITHUB_OIDC: ${{ steps.cleanup_oidc.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${FACTORY_VISUAL_USER_ID:-}" ]; then exit 0; fi
          body="$(node -e 'process.stdout.write(JSON.stringify({action:"expire",workflowRunId:Number(process.env.GITHUB_RUN_ID),userId:process.env.FACTORY_VISUAL_USER_ID}))')"
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $FACTORY_GITHUB_OIDC" -H "Content-Type: application/json" --data "$body" "$FACTORY_VISUAL_BROKER_URL" >/dev/null
