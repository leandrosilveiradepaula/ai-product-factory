name: V2 Approved Caller Scope PostgreSQL QA
on:
  pull_request:
    paths:
      - "supabase/migrations/20261103012000_v2_approved_single_caller_scope.sql"
      - "scripts/verify_v2_single_caller_scope_postgres.py"
      - ".github/workflows/v2-approved-caller-scope-postgres.yml"
  workflow_dispatch:
permissions: { contents: read }
jobs:
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: v2_scope_qa }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d v2_scope_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.12" }
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Verify bounded authorization and exact-recovery replays
        env:
          FACTORY_V2_SCOPE_QA_DSN: postgresql://postgres:postgres@127.0.0.1:5432/v2_scope_qa
        run: python scripts/verify_v2_single_caller_scope_postgres.py
