name: V2 CI repair target recovery PostgreSQL QA

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/*resume_blocked_v2_ci_repair_target.sql"
      - "scripts/verify_v2_ci_repair_target_postgres.py"
      - "src/ai_product_factory/ci_repair_candidate_evidence.py"
      - "src/ai_product_factory/work_unit_context.py"
      - "tests/test_ci_repair_candidate_evidence.py"
      - ".github/workflows/v2-ci-repair-target-postgres.yml"

permissions:
  contents: read

jobs:
  v2-ci-repair-target-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: factory_v2_repair_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_v2_repair_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Verify exact V2 CI repair recovery on isolated PostgreSQL
        env:
          FACTORY_V2_REPAIR_TEST_ISOLATED: "true"
          FACTORY_V2_REPAIR_TEST_DSN: "postgresql://factory_ci:disposable-only@127.0.0.1:5432/factory_v2_repair_test"
        run: python scripts/verify_v2_ci_repair_target_postgres.py
