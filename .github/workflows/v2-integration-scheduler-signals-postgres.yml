name: V2 integration scheduler signals PostgreSQL QA

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/*v2_integration_scheduler_signals.sql"
      - "scripts/verify_v2_integration_scheduler_signals_postgres.py"
      - ".github/workflows/v2-integration-scheduler-signals-postgres.yml"

permissions:
  contents: read

jobs:
  v2-integration-scheduler-signals:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: factory_v2_signals_qa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_v2_signals_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Assert V2 integration liveness and invalid binding fail-closed
        env:
          FACTORY_V2_SIGNAL_QA_ISOLATED: "true"
          FACTORY_V2_SIGNAL_QA_DSN: "postgresql://factory_ci:disposable-only@127.0.0.1:5432/factory_v2_signals_qa"
        run: python scripts/verify_v2_integration_scheduler_signals_postgres.py
