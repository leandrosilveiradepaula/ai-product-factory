name: V2 Material Decision Gate PostgreSQL QA
on:
  pull_request:
    paths:
      - "supabase/migrations/20261102165000_v2_material_decision_gate.sql"
      - "scripts/verify_v2_material_decision_gate_postgres.py"
      - "src/ai_product_factory/v2_material_decision.py"
      - "src/ai_product_factory/implementation_producer.py"
      - "src/ai_product_factory/change_set_worker.py"
      - "src/ai_product_factory/change_set_store.py"
      - "apps/console/app/gates/page.tsx"
      - "apps/console/lib/control-plane.ts"
      - ".github/workflows/v2-material-decision-gate-postgres.yml"
  workflow_dispatch:
permissions: { contents: read }
jobs:
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: v2_material_gate_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d v2_material_gate_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.12" }
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Adversarial exact-epoch and unauthorized-gate checks in disposable PostgreSQL
        env:
          FACTORY_MATERIAL_GATE_TEST_DSN: postgresql://postgres:postgres@localhost:5432/v2_material_gate_test
        run: python scripts/verify_v2_material_decision_gate_postgres.py
