name: V2 Null Candidate Branch PostgreSQL QA
on:
  pull_request:
    paths:
      - "src/ai_product_factory/github_rest.py"
      - "src/ai_product_factory/change_set_store.py"
      - "src/ai_product_factory/nonproduction_candidate_repin.py"
      - "supabase/migrations/20261102104000_v2_null_candidate_branch_recovery.sql"
      - "scripts/verify_v2_null_candidate_branch_postgres.py"
      - ".github/workflows/v2-null-candidate-branch-postgres.yml"
  workflow_dispatch:
permissions: { contents: read }
jobs:
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: v2_branch_base_qa }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d v2_branch_base_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.12" }
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Test new candidate and exactly-once recovery
        env:
          FACTORY_V2_BRANCH_BASE_QA_DSN: postgresql://postgres:postgres@localhost:5432/v2_branch_base_qa
        run: python scripts/verify_v2_null_candidate_branch_postgres.py
