name: V2 Preprovider Auth Recovery PostgreSQL QA
on:
  pull_request:
    paths:
      - "supabase/migrations/20261102190000_v2_preprovider_auth_lease_recovery.sql"
      - "scripts/verify_v2_preprovider_auth_recovery_postgres.py"
      - ".github/workflows/v2-preprovider-auth-recovery-postgres.yml"
  workflow_dispatch:
permissions: { contents: read }
jobs:
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: preprovider_recovery_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d preprovider_recovery_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.12" }
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Negative and idempotence checks in isolated PostgreSQL
        env:
          FACTORY_PREPROVIDER_TEST_DSN: postgresql://postgres:postgres@localhost:5432/preprovider_recovery_test
        run: python scripts/verify_v2_preprovider_auth_recovery_postgres.py
