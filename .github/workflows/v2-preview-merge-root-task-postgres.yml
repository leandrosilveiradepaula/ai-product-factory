name: V2 preview merge root task PostgreSQL QA

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/*v2_preview_merge_root_task_guard.sql"
      - "supabase/migrations/*v2_preview_root_terminal_reconciliation.sql"
      - "scripts/verify_v2_preview_merge_root_task_postgres.py"
      - ".github/workflows/v2-preview-merge-root-task-postgres.yml"

permissions:
  contents: read

jobs:
  v2-preview-merge-root-task:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: factory_ci
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: factory_preview_observer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U factory_ci -d factory_preview_observer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Assert exact V2 Preview root task and strict merged-SHA gates
        env:
          FACTORY_PREVIEW_OBSERVER_TEST_ISOLATED: "true"
          FACTORY_PREVIEW_OBSERVER_TEST_DSN: "postgresql://factory_ci:disposable-only@127.0.0.1:5432/factory_preview_observer_test"
        run: python scripts/verify_v2_preview_merge_root_task_postgres.py
