name: V2 Qualified Source Declaration Recovery PostgreSQL QA
on:
  pull_request:
    paths:
      - "src/ai_product_factory/issue_source_applicability.py"
      - "tests/test_issue_source_applicability.py"
      - "supabase/migrations/20261101150000_v2_qualified_declaration_preflight_recovery.sql"
      - "scripts/verify_v2_qualified_declaration_recovery_postgres.py"
      - ".github/workflows/v2-qualified-declaration-recovery-postgres.yml"
  workflow_dispatch:
permissions: { contents: read }
jobs:
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: v2_declaration_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d v2_declaration_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.12" }
      - run: python -m pip install "psycopg[binary]==3.2.10"
      - name: Exact source declaration and recovery adversarial PostgreSQL QA
        env:
          FACTORY_V2_DECLARATION_TEST_DSN: postgresql://postgres:postgres@localhost:5432/v2_declaration_test
        run: python scripts/verify_v2_qualified_declaration_recovery_postgres.py
