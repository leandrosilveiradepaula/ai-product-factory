name: validate

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      # Enforce source scope from PR BASE, never trust a changed checker in the PR.
      # This separate checkout is for a read-only git diff; no credentials persist.
      - name: Fetch exact PR head for B1-B4 scope gate
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: .factory-focus-checkout
      - name: Enforce exact-SHA B1-B4 Factory scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          FOCUS_REPOSITORY: ${{ github.repository }}
          FOCUS_BASE: ${{ github.event.pull_request.base.sha }}
          FOCUS_HEAD: ${{ github.event.pull_request.head.sha }}
          FOCUS_EVENT: ${{ github.event_path }}
        run: |
          set -euo pipefail
          ROOT=".factory-focus-checkout"
          test "$FOCUS_REPOSITORY" = 'leandrosilveiradepaula/ai-product-factory'
          [[ "$FOCUS_BASE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FOCUS_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$FOCUS_HEAD"
          git -C "$ROOT" cat-file -e "$FOCUS_BASE^{commit}"
          if git -C "$ROOT" cat-file -e "$FOCUS_BASE:scripts/check_block1_focus.py" 2>/dev/null; then
            git -C "$ROOT" show "$FOCUS_BASE:scripts/check_block1_focus.py" > "$RUNNER_TEMP/factory-base-focus.py"
          else
            # First bootstrap PR only. Human reviewer must inspect new guard.
            test -f "$ROOT/scripts/check_block1_focus.py"
            cp "$ROOT/scripts/check_block1_focus.py" "$RUNNER_TEMP/factory-base-focus.py"
          fi
          python "$RUNNER_TEMP/factory-base-focus.py" \
            --event "$FOCUS_EVENT" --repository "$FOCUS_REPOSITORY" \
            --base "$FOCUS_BASE" --head "$FOCUS_HEAD" --worktree "$ROOT"
      - name: Validate manifest
        env:
          PYTHONPATH: src
        run: python -m ai_product_factory.cli validate config/factory.example.json
      - name: Check fail-closed source security and certification boundaries
        run: python scripts/audit_block1_source_boundaries.py
      - name: Inventory nine Block 1 criteria without granting PASS
        run: python scripts/audit_finalization_block1.py
      - name: Inventory mock/noop/demo runtime source markers without certifying reachability
        run: python scripts/inventory_block1_simulation_paths.py
      - name: Map all 19 requirements to source and tests without granting PASS
        env:
          PYTHONPATH: src
        run: python scripts/trace_block1_requirements.py
      - name: Inspect supply chain and pinned actions without credentials
        run: python scripts/audit_block1_supply_chain.py
      - name: Exercise documented setup in isolated credential-free environment
        run: python scripts/exercise_block1_setup.py
      - name: Audit effective main ruleset without changing access
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/audit_block1_effective_gates.py
      - name: Inventory Console API authorization and CSRF boundaries
        run: python scripts/audit_block1_console_routes.py
      - name: Test collection guard
        run: python scripts/check_test_collection.py
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      # Execute every protected Console route against throwing backend sentinels.
      # This is credential-free boundary evidence, not live JWT or E2E proof.
      - name: Install pinned Console TypeScript for B2 runtime boundary suite
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix apps/console
      - name: Execute B2 Console ingress and operator authorization denials
        run: node --test scripts/test_block1_b2_console_boundary.cjs
      - name: Verify B2 live Console access witness negative contracts
        run: node --test scripts/test_block1_b2_live_console_access.mjs
      - name: Block 1 B2/B3 sanitized witness and hydration failure tests
        run: node --test scripts/test_block1_b2_b3_sanitized_witness.mjs
      - name: Adversarial Console Auth response and operator role tests
        run: node --no-warnings --experimental-strip-types --test apps/console/tests/auth-api-boundaries.test.mjs
      - name: Signed GitHub App event authentication unit tests
        run: node --no-warnings --experimental-strip-types --test apps/console/tests/github-webhook-security.test.mjs
      - name: Authenticated Console visual origin and credential boundary regression
        run: node --test scripts/test_console_visual_deployment.mjs
      - name: Cross-repo browser correlation unit tests
        run: node --test scripts/tests/browser_run_correlation.test.cjs
      - name: Test complete authenticated Console desktop and mobile surface evidence contract
        run: node --test scripts/tests/console_surface_coverage_contract.test.mjs
      - name: Read-only lifecycle browser contract tests
        run: node --test scripts/tests/project_control_readonly_contract.test.mjs
      - name: Preview visible text normalization tests
        run: node --test scripts/tests/preview_text_match.test.cjs
      - name: Console migration provenance and idempotency contract tests
        run: node --test apps/console/tests/migration-history-integrity.test.mjs
      - name: Compile
        run: python -m compileall -q src


  factory-acceptance:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Factory acceptance gate
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_factory_acceptance -v
