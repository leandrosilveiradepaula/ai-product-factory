name: validate

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Validate manifest
        env:
          PYTHONPATH: src
        run: python -m ai_product_factory.cli validate config/factory.example.json
      - name: Check fail-closed source security and certification boundaries
        run: python scripts/audit_block1_source_boundaries.py
      - name: Inventory nine Block 1 criteria without granting PASS
        run: python scripts/audit_finalization_block1.py
      - name: Inventory mock/noop/demo runtime source markers without certifying reachability
        run: python scripts/inventory_block1_simulation_paths.py
      - name: Map all 19 requirements to source and tests without granting PASS
        env:
          PYTHONPATH: src
        run: python scripts/trace_block1_requirements.py
      - name: Test collection guard
        run: python scripts/check_test_collection.py
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Signed GitHub App event authentication unit tests
        run: node --no-warnings --experimental-strip-types --test apps/console/tests/github-webhook-security.test.mjs
      - name: Authenticated Console visual origin and credential boundary regression
        run: node --test scripts/test_console_visual_deployment.mjs
      - name: Cross-repo browser correlation unit tests
        run: node --test scripts/tests/browser_run_correlation.test.cjs
      - name: Read-only lifecycle browser contract tests
        run: node --test scripts/tests/project_control_readonly_contract.test.mjs
      - name: Preview visible text normalization tests
        run: node --test scripts/tests/preview_text_match.test.cjs
      - name: Console migration provenance and idempotency contract tests
        run: node --test apps/console/tests/migration-history-integrity.test.mjs
      - name: Compile
        run: python -m compileall -q src


  factory-acceptance:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Factory acceptance gate
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_factory_acceptance -v
