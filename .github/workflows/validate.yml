name: validate

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Validate manifest
        env:
          PYTHONPATH: src
        run: python -m ai_product_factory.cli validate config/factory.example.json
      - name: Test collection guard
        run: python scripts/check_test_collection.py
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Cross-repo browser correlation unit tests
        run: node --test scripts/tests/browser_run_correlation.test.cjs
      - name: Read-only lifecycle browser contract tests
        run: node --test scripts/tests/project_control_readonly_contract.test.mjs
      - name: Console migration provenance and idempotency contract tests
        run: node --test apps/console/tests/migration-history-integrity.test.mjs
      - name: Compile
        run: python -m compileall -q src


  factory-acceptance:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Factory acceptance gate
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_factory_acceptance -v
