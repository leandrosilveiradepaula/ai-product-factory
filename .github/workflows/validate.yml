name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manifest
        env:
          PYTHONPATH: src
        run: python -m ai_product_factory.cli validate config/factory.example.json
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src


  factory-acceptance:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Factory acceptance gate
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_factory_acceptance -v
