name: Vercel CLI readiness probe

on:
  push:
    branches:
      - "test/vercel-cli-readiness"
    paths:
      - ".github/workflows/vercel-cli-readiness-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verify Vercel deploy credential presence
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured for repository Actions."
            exit 2
          fi
          echo "VERCEL_TOKEN is configured; value not printed."
