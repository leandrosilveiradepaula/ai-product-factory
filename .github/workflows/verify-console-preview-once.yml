name: Exact Console Preview browser evidence

on:
  push:
    branches:
      - "test/259-exact-browser-evidence"
    paths:
      - ".github/workflows/verify-console-preview-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify exact existing Preview
        env:
          FACTORY_PREVIEW_URL: https://ai-product-factory-console-pbpcipzs8-leandros-projects-102e32ab.vercel.app
          EXPECTED_TEXT: AI Product Factory
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");
          const url = process.env.FACTORY_PREVIEW_URL;
          const expected = process.env.EXPECTED_TEXT;
          const errors = [];
          let browser;
          (async () => {
            browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            page.on("pageerror", error => errors.push("pageerror: " + error.message));
            page.on("console", message => {
              if (message.type() === "error") errors.push("console: " + message.text());
            });
            const response = await page.goto(url, { waitUntil: "domcontentloaded", timeout: 45000 });
            if (!response) throw new Error("navigation returned no HTTP response");
            if (response.status() >= 400) throw new Error("HTTP " + response.status());
            await page.waitForTimeout(1000);
            const body = (await page.locator("body").innerText()).trim();
            if (!body) throw new Error("empty body");
            if (!body.includes(expected)) throw new Error("expected Factory marker not present; body starts: " + body.slice(0, 180));
            if (errors.length) throw new Error(errors.slice(0, 10).join(" | "));
            console.log(JSON.stringify({
              status: "success",
              preview_url: url,
              checks: ["page_load","http_status","body_visible","factory_marker","console_clean"]
            }));
          })().catch(error => {
            console.error(String(error && error.stack || error));
            process.exitCode = 1;
          }).finally(async () => {
            if (browser) await browser.close();
          });
          NODE
